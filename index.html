<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#087fc5">
  <title>HOLa Alliance Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Cinzel:wght@800;900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23087fc5'/%3E%3Cpath d='M13 17h10v11h18V17h10v30H41V36H23v11H13z' fill='%23ffd451'/%3E%3C/svg%3E">
  <style>
    :root {
      --blue:#087fc5;
      --deep-blue:#07487b;
      --gold:#ffd451;
      --sand:#f5dfb6;
      --paper:#fff9ec;
    }

    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; }

    body {
      background:
        radial-gradient(circle at 50% 12%,rgba(255,255,255,.95),transparent 28rem),
        linear-gradient(180deg,#fff9ec 0%,#f6e3be 100%);
      color:#153554;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }

    .app {
      width:100%;
      max-width:520px;
      min-height:100vh;
      margin:0 auto;
      overflow:hidden;
      background:var(--paper);
      box-shadow:0 0 35px rgba(76,45,6,.18);
    }

    .hero {
      position:relative;
      width:100%;
      aspect-ratio:1/1;
      overflow:hidden;
      isolation:isolate;
      background:#168bd0;
    }

    .hero__scene {
      position:absolute;
      inset:0;
      z-index:0;
      width:100%;
      height:100%;
      object-fit:cover;
      user-select:none;
      pointer-events:none;
    }

    .hero::before {
      content:"";
      position:absolute;
      inset:0;
      z-index:1;
      pointer-events:none;
      background:
        linear-gradient(180deg,rgba(1,75,137,.13),transparent 30%,rgba(88,45,4,.08)),
        radial-gradient(circle at 50% 26%,transparent 0 24%,rgba(0,53,105,.12) 72%,rgba(0,28,61,.20) 100%);
    }

    .hero__logo {
      position:absolute;
      z-index:4;
      top:8%;
      left:50%;
      width:54.4%;
      height:auto;
      transform:translateX(-50%);
      filter:drop-shadow(0 5px 5px rgba(1,25,58,.78)) drop-shadow(0 0 12px rgba(22,147,225,.62));
      user-select:none;
      pointer-events:none;
    }

    .hero__logo-shadow {
      position:absolute;
      z-index:2;
      top:3%;
      left:50%;
      width:65%;
      height:48%;
      transform:translateX(-50%);
      border-radius:50%;
      background:radial-gradient(ellipse at center,rgba(2,35,78,.62) 0%,rgba(3,56,102,.38) 44%,transparent 74%);
      filter:blur(7px);
      pointer-events:none;
    }

    .hero__girl {
      position:absolute;
      z-index:3;
      right:-2%;
      bottom:0;
      width:81%;
      height:52%;
      object-fit:contain;
      object-position:right bottom;
      filter:drop-shadow(-8px 6px 10px rgba(63,31,2,.32));
      user-select:none;
      cursor:pointer;
      touch-action:manipulation;
      -webkit-tap-highlight-color:transparent;
    }

    .hero__girl:focus-visible {
      outline:3px solid #79eaff;
      outline-offset:-5px;
      border-radius:45%;
    }

    .hero__overlord {
      position:absolute;
      z-index:2;
      left:-18%;
      bottom:-3%;
      width:86%;
      height:64%;
      object-fit:contain;
      object-position:left bottom;
      transform-origin:45% 78%;
      filter:drop-shadow(8px 7px 10px rgba(48,27,5,.38));
      user-select:none;
      cursor:pointer;
      touch-action:manipulation;
      -webkit-tap-highlight-color:transparent;
    }

    .hero__overlord:focus-visible {
      outline:3px solid #ffe074;
      outline-offset:-5px;
      border-radius:45%;
    }

    .language {
      position:absolute;
      z-index:5;
      top:max(10px,env(safe-area-inset-top));
      right:10px;
    }

    .language__toggle {
      width:38px;
      height:38px;
      padding:0;
      display:grid;
      place-items:center;
      border:2px solid rgba(255,228,135,.96);
      border-radius:50%;
      background:rgba(4,70,122,.82);
      box-shadow:0 3px 12px rgba(0,0,0,.32),inset 0 0 0 2px rgba(255,255,255,.13);
      backdrop-filter:blur(5px);
      cursor:pointer;
    }

    .language__current {
      width:25px;
      height:25px;
      border-radius:50%;
      object-fit:cover;
      box-shadow:0 0 0 1px rgba(255,255,255,.85);
    }

    .language__list {
      position:absolute;
      top:45px;
      right:0;
      width:152px;
      margin:0;
      padding:6px;
      display:grid;
      gap:2px;
      list-style:none;
      border:1px solid rgba(255,212,81,.8);
      border-radius:14px;
      background:rgba(5,59,104,.96);
      box-shadow:0 12px 28px rgba(0,0,0,.35);
      backdrop-filter:blur(9px);
      max-height:min(330px,calc(100vw - 62px),calc(100svh - 72px));
      overflow-y:auto;
      overscroll-behavior:contain;
      scrollbar-width:thin;
      -webkit-overflow-scrolling:touch;
    }

    .language__list[hidden] { display:none; }

    .language__option {
      width:100%;
      min-height:36px;
      padding:7px 8px;
      display:flex;
      align-items:center;
      gap:9px;
      border:0;
      border-radius:9px;
      background:transparent;
      color:#fff;
      font:600 14px/1 system-ui,sans-serif;
      text-align:left;
      cursor:pointer;
    }

    .language__option:hover,.language__option:focus-visible {
      outline:none;
      background:rgba(255,255,255,.14);
    }

    .language__option img {
      width:24px;
      height:17px;
      border-radius:3px;
      object-fit:cover;
    }

    .admin-link {
      position:absolute;
      z-index:5;
      top:max(10px,env(safe-area-inset-top));
      left:10px;
      width:38px;
      height:38px;
      display:grid;
      place-items:center;
      border:2px solid rgba(255,228,135,.96);
      border-radius:50%;
      background:rgba(4,70,122,.82);
      box-shadow:0 3px 12px rgba(0,0,0,.32),inset 0 0 0 2px rgba(255,255,255,.13);
      backdrop-filter:blur(5px);
      text-decoration:none;
    }

    .admin-link img {
      width:33px;
      height:33px;
      display:block;
      object-fit:contain;
      filter:drop-shadow(0 1px 2px rgba(0,0,0,.45));
    }

    .admin-link:focus-visible,
    .admin-link:hover {
      outline:2px solid #fff1a8;
      outline-offset:2px;
    }

    .hero__edge {
      position:absolute;
      z-index:4;
      right:-2px;
      bottom:-1px;
      left:-2px;
      height:20px;
      background:linear-gradient(90deg,#f7dfad,#fff7df 46%,#f1d397);
      clip-path:polygon(0 58%,9% 38%,22% 63%,38% 32%,52% 60%,68% 28%,83% 55%,100% 35%,100% 100%,0 100%);
      filter:drop-shadow(0 -2px 2px rgba(111,61,8,.22));
    }

    .next-section {
      min-height:35vh;
      position:relative;
      z-index:4;
      padding:1px 10px 42px;
      background:
        radial-gradient(circle at 50% 0,rgba(255,255,255,.88),transparent 250px),
        linear-gradient(180deg,#fff8e7,#f7e2b9);
    }

    .overview {
      position:relative;
      isolation:isolate;
      min-height:0;
      margin-top:-45px;
      padding:12px 13px 2px;
      filter:drop-shadow(0 9px 13px rgba(79,44,5,.24));
    }

    .overview::before {
      content:"";
      position:absolute;
      inset:0;
      z-index:-1;
      border:1px solid rgba(246,211,126,.72);
      border-radius:24px;
      background:linear-gradient(145deg,rgba(255,255,255,.98),rgba(255,251,239,.96));
      clip-path:polygon(0 0,52% 0,64% 17%,100% 17%,100% 100%,0 100%);
    }

    .overview__title {
      width:60%;
      margin:0 0 3px;
      color:#123f72;
      font-size:clamp(16px,4.6vw,22px);
      line-height:1;
      letter-spacing:.01em;
      text-transform:uppercase;
      text-shadow:0 2px 2px rgba(20,63,113,.17);
    }

    .overview__identity {
      width:62%;
      display:flex;
      align-items:center;
      gap:9px;
    }

    .overview__crest {
      flex:0 0 48px;
      height:54px;
      display:grid;
      place-items:center;
      color:#ffe070;
      font-size:23px;
      font-weight:900;
      text-shadow:0 2px 3px #001c39;
      background:linear-gradient(135deg,#0a68a9 0 50%,#073b70 50%);
      border:4px solid #e8af2f;
      clip-path:polygon(50% 0,96% 19%,90% 73%,50% 100%,10% 73%,4% 19%);
      box-shadow:inset 0 0 0 3px #fff0a0;
    }

    .overview__name {
      margin:0;
      color:#123d70;
      font-size:clamp(27px,7.8vw,38px);
      line-height:.9;
    }

    .overview__full-name {
      margin:4px 0 0;
      color:#24476b;
      font-size:clamp(11px,3.1vw,15px);
      font-weight:650;
      line-height:1.05;
      white-space:nowrap;
    }

    .overview__values {
      height:58px;
      margin:0;
      padding:0;
      display:grid;
      grid-template-columns:.85fr .85fr 1.3fr;
      align-items:center;
      border-top:1px solid rgba(45,151,193,.25);
    }

    .overview__traits {
      height:28px;
      margin:0;
      padding-left:57px;
      display:flex;
      align-items:center;
      justify-content:flex-start;
      gap:5px;
      color:#12a7ca;
      font-size:clamp(10px,2.7vw,13px);
      font-weight:900;
      letter-spacing:.015em;
      text-transform:uppercase;
      white-space:nowrap;
    }

    .overview__traits span:nth-child(5) { color:#e838af; }
    .overview__traits i { color:#155084; font-style:normal; }

    .overview__stat {
      min-width:0;
      height:48px;
      padding:0 4px;
      display:flex;
      flex-direction:column;
      justify-content:center;
      text-align:center;
    }

    .overview__stat + .overview__stat {
      border-left:1px solid rgba(45,151,193,.22);
    }

    .overview__label {
      display:block;
      color:#173f6c;
      font-size:11px;
      font-weight:850;
      line-height:1;
      text-transform:uppercase;
    }

    .overview__number {
      display:block;
      margin-top:3px;
      color:#0b376b;
      font-size:clamp(24px,7vw,35px);
      font-weight:900;
      line-height:1;
      letter-spacing:-.045em;
    }

    .overview__stat:last-child .overview__number {
      font-size:clamp(20px,5.8vw,29px);
    }

    .events {
      margin-top:18px;
      padding:14px 10px 12px;
      border:1px solid rgba(233,182,64,.58);
      border-radius:24px;
      background:rgba(255,253,246,.92);
      box-shadow:0 10px 22px rgba(94,55,8,.15);
    }

    .events__heading {
      margin:0 3px 11px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      color:#123f72;
      text-transform:uppercase;
    }

    .events__heading h2 {
      margin:0;
      font-size:clamp(16px,4.5vw,22px);
      line-height:1;
    }

    .events__all {
      border:0;
      padding:0;
      background:none;
      color:#087fc5;
      font:800 clamp(11px,3vw,14px)/1 system-ui,sans-serif;
      white-space:nowrap;
    }

    .events__grid {
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:8px;
    }

    .event-card {
      position:relative;
      aspect-ratio:16/9;
      overflow:hidden;
      isolation:isolate;
      border:1px solid rgba(255,211,81,.78);
      border-radius:13px;
      background:#092b46;
      box-shadow:0 6px 13px rgba(28,52,69,.22),inset 0 0 0 1px rgba(255,255,255,.2);
    }

    .event-card img {
      width:100%;
      height:100%;
      display:block;
      object-fit:cover;
    }

    .event-card::after {
      content:"";
      position:absolute;
      inset:0;
      z-index:1;
      background:linear-gradient(90deg,rgba(2,10,19,.82),rgba(2,10,19,.48) 42%,rgba(2,10,19,.03) 76%);
      pointer-events:none;
    }

    .event-card__copy {
      position:absolute;
      z-index:2;
      top:50%;
      left:5%;
      width:62%;
      color:#fff;
      text-align:center;
      transform:translateY(-50%);
    }

    .event-card__title {
      margin:0;
      font-size:clamp(12px,3.3vw,18px);
      font-weight:900;
      line-height:1;
      text-transform:uppercase;
      text-wrap:balance;
    }

    .event-card__brand {
      display:block;
      margin-top:5px;
      color:#fff1c8;
      font:600 clamp(6px,1.55vw,9px)/1 Georgia,serif;
      letter-spacing:.055em;
      white-space:nowrap;
      text-shadow:0 1px 2px rgba(0,0,0,.8);
    }

    .event-alliance .event-card__title,
    .event-desert .event-card__title {
      font-family:"Cinzel",Georgia,serif;
      color:transparent;
      background:linear-gradient(180deg,#fff8d6 0%,#f4d278 32%,#b96b19 68%,#ffe9a0 100%);
      -webkit-background-clip:text;
      background-clip:text;
      -webkit-text-stroke:.2px #6d3d10;
      filter:drop-shadow(0 2px 2px rgba(40,20,0,.88));
    }

    .event-zombie .event-card__title,
    .event-invasion .event-card__title {
      font-family:"Black Ops One","Arial Black",sans-serif;
      color:transparent;
      background:linear-gradient(180deg,#e9fbff 0%,#91cee1 35%,#3f778a 66%,#d4f5ff 100%);
      -webkit-background-clip:text;
      background-clip:text;
      -webkit-text-stroke:.22px #173e4d;
      filter:drop-shadow(0 2px 2px rgba(0,16,24,.9));
    }

    .event-invasion .event-card__title {
      background:linear-gradient(180deg,#fff7bd 0%,#ffc83d 36%,#b6680f 68%,#ffe08a 100%);
      -webkit-background-clip:text;
      background-clip:text;
      -webkit-text-stroke:.22px #573106;
    }

    @media (max-width:370px) {
      .hero__logo { top:9%; width:52%; }
      .hero__girl { right:-3%; bottom:0; width:84%; height:51%; }
      .hero__overlord { left:-21%; bottom:-3%; width:90%; height:63%; }
      .language__toggle { width:34px; height:34px; }
      .language__current { width:22px; height:22px; }
      .admin-link { width:34px; height:34px; }
      .admin-link img { width:29px; height:29px; }
      .overview { min-height:0; margin-top:-42px; padding-inline:11px; }
      .overview__crest { flex-basis:46px; height:52px; }
      .overview__traits { padding-left:55px; gap:4px; font-size:10px; }
      .events { padding-inline:8px; }
      .events__grid { gap:6px; }
      .event-card { border-radius:10px; }
    }

    @media (min-width:700px) {
      body { padding:24px 0; }
      .app { min-height:calc(100vh - 48px); border-radius:28px; }
      .hero { border-radius:28px 28px 0 0; }
    }

    @media (prefers-reduced-motion:no-preference) {
      .hero__logo { animation:logo-in .65s ease-out both; }
      .hero__girl { animation:girl-in .7s .08s ease-out both; }
      .hero__overlord { animation:overlord-in .72s .38s ease-out both; }
      @keyframes logo-in { from { opacity:0; transform:translate(-50%,-10px) scale(.96); } }
      @keyframes girl-in { from { opacity:0; transform:translate(18px,12px); } }
      @keyframes overlord-in { from { opacity:0; transform:translate(-22px,13px) scale(.95); } }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="hero" aria-label="HOLa Alliance Tracker">
      <img class="hero__scene" src="hola-s3-background-square.png" alt="Egipto al atardecer con pirámides y vehículos militares">
      <div class="hero__logo-shadow" aria-hidden="true"></div>
      <img class="hero__logo" src="hola-s3-logo.png" alt="HOLa — Heroes of Last Area, Alliance Tracker, Last War S3 Golden Kingdom">
      <video class="hero__overlord" id="overlordVideo" muted playsinline preload="auto"
        poster="hola-s3-overlord.png" role="button" tabindex="0"
        aria-label="Reproducir rugido del Gorila Overlord">
        <source src="hola-overlord-roar.webm" type="video/webm">
      </video>
      <video class="hero__girl" id="heroineVideo" muted playsinline preload="auto"
        poster="hola-s3-heroine-idle.png" role="button" tabindex="0"
        aria-label="Activar el poder de la heroína egipcia">
        <source src="hola-heroine-idle.webm" type="video/webm">
      </video>

      <a class="admin-link" href="admin-center-hola_login.html" aria-label="Centro de administración" data-i18n-aria="adminCenter">
        <img src="hola-admin-gear.png" alt="">
      </a>

      <div class="language">
        <button class="language__toggle" id="languageToggle" type="button" aria-label="Cambiar idioma" data-i18n-aria="changeLanguage" aria-expanded="false" aria-controls="languageList">
          <img class="language__current" id="currentFlag" src="https://flagcdn.com/w80/es.png" alt="Español">
        </button>
        <ul class="language__list" id="languageList" hidden>
          <li><button class="language__option" data-code="es" data-html="es" data-name="Español"><img src="https://flagcdn.com/w40/es.png" alt="">Español</button></li>
          <li><button class="language__option" data-code="gb" data-html="en" data-name="English"><img src="https://flagcdn.com/w40/gb.png" alt="">English</button></li>
          <li><button class="language__option" data-code="fr" data-html="fr" data-name="Français"><img src="https://flagcdn.com/w40/fr.png" alt="">Français</button></li>
          <li><button class="language__option" data-code="de" data-html="de" data-name="Deutsch"><img src="https://flagcdn.com/w40/de.png" alt="">Deutsch</button></li>
          <li><button class="language__option" data-code="ro" data-html="ro" data-name="Română"><img src="https://flagcdn.com/w40/ro.png" alt="">Română</button></li>
          <li><button class="language__option" data-code="pt" data-html="pt" data-name="Português"><img src="https://flagcdn.com/w40/pt.png" alt="">Português</button></li>
          <li><button class="language__option" data-code="ua" data-html="uk" data-name="Українська"><img src="https://flagcdn.com/w40/ua.png" alt="">Українська</button></li>
          <li><button class="language__option" data-code="it" data-html="it" data-name="Italiano"><img src="https://flagcdn.com/w40/it.png" alt="">Italiano</button></li>
          <li><button class="language__option" data-code="pl" data-html="pl" data-name="Polski"><img src="https://flagcdn.com/w40/pl.png" alt="">Polski</button></li>
        </ul>
      </div>
      <div class="hero__edge" aria-hidden="true"></div>
    </header>

    <main class="next-section">
      <section class="overview" aria-labelledby="overviewTitle">
        <h1 class="overview__title" id="overviewTitle" data-i18n="overview">Alliance Overview</h1>
        <div class="overview__identity">
          <div class="overview__crest" aria-hidden="true">H</div>
          <div>
            <p class="overview__name">HOLa</p>
            <p class="overview__full-name">Heroes of Last Area</p>
          </div>
        </div>
        <p class="overview__traits"><span data-i18n="strategy">Strategy</span><i>•</i><span data-i18n="teamwork">Teamwork</span><i>•</i><span data-i18n="family">Family</span><i>•</i><span data-i18n="victory">Victory</span></p>
        <div class="overview__values" aria-label="Estadísticas de la alianza" data-i18n-aria="allianceStats">
          <div class="overview__stat"><span class="overview__label" data-i18n="members">Members</span><strong class="overview__number" id="membersValue">—</strong></div>
          <div class="overview__stat"><span class="overview__label" data-i18n="countries">Countries</span><strong class="overview__number" id="countriesValue">—</strong></div>
          <div class="overview__stat"><span class="overview__label" data-i18n="thp">THP</span><strong class="overview__number" id="thpValue">—</strong></div>
        </div>
      </section>

      <section class="events" aria-labelledby="eventsTitle">
        <div class="events__heading">
          <h2 id="eventsTitle" data-i18n="eventsTitle">Próximos eventos</h2>
          <span class="events__all" data-i18n="viewAll">Ver todos →</span>
        </div>
        <div class="events__grid">
          <article class="event-card event-alliance">
            <img src="event-alliance.png" alt="" loading="lazy">
            <div class="event-card__copy">
              <h3 class="event-card__title" data-i18n="allianceExercise">Ejercicio de alianza</h3>
              <span class="event-card__brand">Heroes of Last Area</span>
            </div>
          </article>
          <article class="event-card event-zombie">
            <img src="event-zombie.png" alt="" loading="lazy">
            <div class="event-card__copy">
              <h3 class="event-card__title" data-i18n="zombieSiege">Asedio zombi</h3>
              <span class="event-card__brand">Heroes of Last Area</span>
            </div>
          </article>
          <article class="event-card event-desert">
            <img src="event-desert.png" alt="" loading="lazy">
            <div class="event-card__copy">
              <h3 class="event-card__title" data-i18n="desertStorm">Tormenta del desierto</h3>
              <span class="event-card__brand">Heroes of Last Area</span>
            </div>
          </article>
          <article class="event-card event-invasion">
            <img src="event-zombie-invasion.png" alt="" loading="lazy">
            <div class="event-card__copy">
              <h3 class="event-card__title" data-i18n="zombieInvasion">Invasión zombi</h3>
              <span class="event-card__brand">Heroes of Last Area</span>
            </div>
          </article>
        </div>
      </section>
    </main>
  </div>

  <script>
    const toggle=document.getElementById('languageToggle');
    const list=document.getElementById('languageList');
    const flag=document.getElementById('currentFlag');

    const translations={
      es:{pageTitle:'HOLa — Centro de la alianza',overview:'Resumen de la alianza',strategy:'Estrategia',teamwork:'Equipo',family:'Familia',victory:'Victoria',members:'Miembros',countries:'Países',thp:'THP',eventsTitle:'Próximos eventos',viewAll:'Ver todos →',allianceExercise:'Ejercicio de alianza',zombieSiege:'Asedio zombi',desertStorm:'Tormenta del desierto',zombieInvasion:'Invasión zombi',changeLanguage:'Cambiar idioma',adminCenter:'Centro de administración',allianceStats:'Estadísticas de la alianza'},
      en:{pageTitle:'HOLa — Alliance Tracker',overview:'Alliance Overview',strategy:'Strategy',teamwork:'Teamwork',family:'Family',victory:'Victory',members:'Members',countries:'Countries',thp:'THP',eventsTitle:'Upcoming events',viewAll:'View all →',allianceExercise:'Alliance Exercise',zombieSiege:'Zombie Siege',desertStorm:'Desert Storm',zombieInvasion:'Zombie Invasion',changeLanguage:'Change language',adminCenter:'Administration center',allianceStats:'Alliance statistics'},
      fr:{pageTitle:'HOLa — Centre de l’alliance',overview:'Vue de l’alliance',strategy:'Stratégie',teamwork:'Équipe',family:'Famille',victory:'Victoire',members:'Membres',countries:'Pays',thp:'THP',eventsTitle:'Événements à venir',viewAll:'Voir tout →',allianceExercise:'Exercice d’alliance',zombieSiege:'Siège zombie',desertStorm:'Tempête du désert',zombieInvasion:'Invasion zombie',changeLanguage:'Changer de langue',adminCenter:'Centre d’administration',allianceStats:'Statistiques de l’alliance'},
      de:{pageTitle:'HOLa — Allianz-Zentrale',overview:'Allianzübersicht',strategy:'Strategie',teamwork:'Teamarbeit',family:'Familie',victory:'Sieg',members:'Mitglieder',countries:'Länder',thp:'THP',eventsTitle:'Bevorstehende Ereignisse',viewAll:'Alle ansehen →',allianceExercise:'Allianz-Übung',zombieSiege:'Zombie-Belagerung',desertStorm:'Wüstensturm',zombieInvasion:'Zombie-Invasion',changeLanguage:'Sprache ändern',adminCenter:'Administrationszentrum',allianceStats:'Allianzstatistiken'},
      ro:{pageTitle:'HOLa — Centrul alianței',overview:'Prezentarea alianței',strategy:'Strategie',teamwork:'Echipă',family:'Familie',victory:'Victorie',members:'Membri',countries:'Țări',thp:'THP',eventsTitle:'Evenimente viitoare',viewAll:'Vezi tot →',allianceExercise:'Exercițiul alianței',zombieSiege:'Asediul zombi',desertStorm:'Furtună în deșert',zombieInvasion:'Invazie zombi',changeLanguage:'Schimbă limba',adminCenter:'Centrul de administrare',allianceStats:'Statisticile alianței'},
      pt:{pageTitle:'HOLa — Centro da aliança',overview:'Visão da aliança',strategy:'Estratégia',teamwork:'Equipe',family:'Família',victory:'Vitória',members:'Membros',countries:'Países',thp:'THP',eventsTitle:'Próximos eventos',viewAll:'Ver todos →',allianceExercise:'Exercício da aliança',zombieSiege:'Cerco zumbi',desertStorm:'Tempestade do deserto',zombieInvasion:'Invasão zumbi',changeLanguage:'Mudar idioma',adminCenter:'Centro de administração',allianceStats:'Estatísticas da aliança'},
      uk:{pageTitle:'HOLa — Центр альянсу',overview:'Огляд альянсу',strategy:'Стратегія',teamwork:'Команда',family:'Родина',victory:'Перемога',members:'Учасники',countries:'Країни',thp:'THP',eventsTitle:'Майбутні події',viewAll:'Переглянути всі →',allianceExercise:'Навчання альянсу',zombieSiege:'Облога зомбі',desertStorm:'Буря в пустелі',zombieInvasion:'Вторгнення зомбі',changeLanguage:'Змінити мову',adminCenter:'Центр адміністрування',allianceStats:'Статистика альянсу'},
      it:{pageTitle:'HOLa — Centro alleanza',overview:'Panoramica alleanza',strategy:'Strategia',teamwork:'Squadra',family:'Famiglia',victory:'Vittoria',members:'Membri',countries:'Paesi',thp:'THP',eventsTitle:'Prossimi eventi',viewAll:'Vedi tutti →',allianceExercise:'Esercitazione dell’alleanza',zombieSiege:'Assedio zombie',desertStorm:'Tempesta nel deserto',zombieInvasion:'Invasione zombie',changeLanguage:'Cambia lingua',adminCenter:'Centro di amministrazione',allianceStats:'Statistiche dell’alleanza'},
      pl:{pageTitle:'HOLa — Centrum sojuszu',overview:'Przegląd sojuszu',strategy:'Strategia',teamwork:'Drużyna',family:'Rodzina',victory:'Zwycięstwo',members:'Członkowie',countries:'Kraje',thp:'THP',eventsTitle:'Nadchodzące wydarzenia',viewAll:'Zobacz wszystkie →',allianceExercise:'Ćwiczenia sojuszu',zombieSiege:'Oblężenie zombie',desertStorm:'Burza pustynna',zombieInvasion:'Inwazja zombie',changeLanguage:'Zmień język',adminCenter:'Centrum administracji',allianceStats:'Statystyki sojuszu'}
    };

    const SUPABASE_URL='https://ovybstpiomphrouvqxmf.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY='sb_publishable_gU5Wgy2NhdXcy23_TotF9g_LKthVmKV';

    function parsePower(value){
      if(!value)return 0;
      const clean=String(value).trim().toUpperCase().replace(/\s/g,'').replace(',','.');
      const match=clean.match(/^([0-9]+(?:\.[0-9]+)?)([KMBT])?$/);
      if(!match)return 0;
      const units={K:1e3,M:1e6,B:1e9,T:1e12};
      return Number(match[1])*(units[match[2]]||1);
    }

    function normalizeCountry(player){
      const raw=String(player.country||player.flag||'').trim();
      if(!raw||raw==='🌍')return '';
      const key=raw.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
      const aliases={
        '🇪🇸':'Spain','espana':'Spain','spain':'Spain','comunidad de madrid':'Spain','galicia':'Spain','pais vasco':'Spain',
        '🇷🇴':'Romania','rumania':'Romania','romania':'Romania',
        '🇫🇷':'France','francia':'France','france':'France',
        '🇩🇪':'Germany','alemania':'Germany','germany':'Germany',
        '🇬🇧':'United Kingdom','reino unido':'United Kingdom','united kingdom':'United Kingdom','uk':'United Kingdom',
        '🇵🇭':'Philippines','filipinas':'Philippines','philippines':'Philippines',
        '🇵🇹':'Portugal','portugal':'Portugal',
        '🇦🇺':'Australia','australia':'Australia',
        '🇧🇬':'Bulgaria','bulgaria':'Bulgaria'
      };
      return aliases[raw]||aliases[key]||raw;
    }

    function formatTotalPower(value){
      if(value>=1e12)return `${(value/1e12).toLocaleString('en-US',{maximumFractionDigits:2})}T`;
      if(value>=1e9)return `${(value/1e9).toLocaleString('en-US',{maximumFractionDigits:2})}B`;
      if(value>=1e6)return `${(value/1e6).toLocaleString('en-US',{maximumFractionDigits:2})}M`;
      return Math.round(value).toLocaleString('en-US');
    }

    async function loadAllianceStats(){
      const cached=localStorage.getItem('hola-alliance-stats');
      if(cached){
        try{renderAllianceStats(JSON.parse(cached));}catch(_error){}
      }
      try{
        const response=await fetch(`${SUPABASE_URL}/rest/v1/players?select=name,thp,country,flag,survey_completed`,{
          headers:{apikey:SUPABASE_PUBLISHABLE_KEY}
        });
        if(!response.ok)throw new Error(`Supabase: ${response.status}`);
        const players=await response.json();
        const stats={
          members:players.length,
          countries:new Set(players.filter(player=>player.survey_completed===true).map(normalizeCountry).filter(Boolean)).size,
          thp:formatTotalPower(players.reduce((total,player)=>total+parsePower(player.thp),0))
        };
        renderAllianceStats(stats);
        localStorage.setItem('hola-alliance-stats',JSON.stringify(stats));
      }catch(error){
        console.warn('No se pudieron actualizar las estadísticas de la alianza.',error);
      }
    }

    function renderAllianceStats(stats){
      document.getElementById('membersValue').textContent=stats.members;
      document.getElementById('countriesValue').textContent=stats.countries;
      document.getElementById('thpValue').textContent=stats.thp;
    }

    function applyLanguage(language){
      const dictionary=translations[language]||translations.es;
      document.querySelectorAll('[data-i18n]').forEach(element=>{
        const translation=dictionary[element.dataset.i18n];
        if(translation)element.textContent=translation;
      });
      document.querySelectorAll('[data-i18n-aria]').forEach(element=>{
        const translation=dictionary[element.dataset.i18nAria];
        if(translation)element.setAttribute('aria-label',translation);
      });
      document.title=dictionary.pageTitle;
      document.documentElement.lang=language;
    }

    function closeLanguages(){
      list.hidden=true;
      toggle.setAttribute('aria-expanded','false');
    }

    toggle.addEventListener('click',()=>{
      const willOpen=list.hidden;
      list.hidden=!willOpen;
      toggle.setAttribute('aria-expanded',String(willOpen));
    });

    list.addEventListener('click',event=>{
      const option=event.target.closest('.language__option');
      if(!option)return;
      flag.src=`https://flagcdn.com/w80/${option.dataset.code}.png`;
      flag.alt=option.dataset.name;
      applyLanguage(option.dataset.html);
      closeLanguages();
    });

    document.addEventListener('click',event=>{
      if(!event.target.closest('.language'))closeLanguages();
    });

    document.addEventListener('keydown',event=>{
      if(event.key==='Escape')closeLanguages();
    });

    const overlordVideo=document.getElementById('overlordVideo');

    function replayOverlord(withSound=true){
      overlordVideo.pause();
      overlordVideo.currentTime=0;
      overlordVideo.muted=!withSound;
      const playback=overlordVideo.play();
      if(playback)playback.catch(()=>{});
    }

    overlordVideo.addEventListener('click',()=>replayOverlord(true));
    overlordVideo.addEventListener('keydown',event=>{
      if(event.key==='Enter'||event.key===' '){
        event.preventDefault();
        replayOverlord(true);
      }
    });

    window.addEventListener('load',()=>replayOverlord(false),{once:true});

    const heroineVideo=document.getElementById('heroineVideo');
    const heroineIdle='hola-heroine-idle.webm';
    const heroinePower='hola-heroine-power.webm';
    let heroineMode='idle';

    function playHeroinePower(){
      heroineMode='power';
      heroineVideo.pause();
      heroineVideo.src=heroinePower;
      heroineVideo.muted=false;
      heroineVideo.currentTime=0;
      const playback=heroineVideo.play();
      if(playback)playback.catch(()=>{});
    }

    heroineVideo.addEventListener('click',playHeroinePower);
    heroineVideo.addEventListener('keydown',event=>{
      if(event.key==='Enter'||event.key===' '){
        event.preventDefault();
        playHeroinePower();
      }
    });

    heroineVideo.addEventListener('ended',()=>{
      if(heroineMode!=='power')return;
      heroineMode='idle';
      heroineVideo.src=heroineIdle;
      heroineVideo.muted=true;
      heroineVideo.addEventListener('loadeddata',()=>{
        heroineVideo.currentTime=.05;
        heroineVideo.pause();
      },{once:true});
      heroineVideo.load();
    });

    window.addEventListener('load',()=>{
      heroineMode='idle';
      heroineVideo.muted=true;
      const playback=heroineVideo.play();
      if(playback)playback.catch(()=>{});
    },{once:true});

    applyLanguage('es');
    loadAllianceStats();
  </script>
</body>
</html>
