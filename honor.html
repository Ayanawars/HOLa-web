<script>
(()=>{'use strict';const base='https://ovybstpiomphrouvqxmf.supabase.co/rest/v1/players?select=name,avatar,uploaded_avatar,hola_avatar,default_avatar,squad1_type,squad1_power,squad2_type,squad2_power,squad3_type,squad3_power&limit=1000',key='sb_publishable_gU5Wgy2NhdXcy23_TotF9g_LKthVmKV';const sections=[['Tank','tank','assets/icon-tank-custom.png','TANQUES'],['Missile','missile','assets/icon-missile-custom.png','MISILES'],['Aircraft','aircraft','assets/icon-air-custom.png','AÉREOS']];const snapshot=[{"name":"ASSASSIN428","type":"Aircraft","power":37800000},{"name":"Laz Ziyaaa ᓚᘏᗢ","type":"Aircraft","power":37680000},{"name":"Arturlion","type":"Aircraft","power":36850000},{"name":"Rey Excalibur","type":"Aircraft","power":35300000},{"name":"dAndrei20","type":"Aircraft","power":35100000},{"name":"Mirrliva","type":"Aircraft","power":34710000},{"name":"iR4UL","type":"Aircraft","power":34460000},{"name":"atEr","type":"Aircraft","power":32260000},{"name":"Naranjitox82","type":"Aircraft","power":32180000},{"name":"SilentBG","type":"Aircraft","power":31690000},{"name":"Ucigăltoaca","type":"Missile","power":36710000},{"name":"Ayana wars","type":"Missile","power":35320000},{"name":"Yugo Léliatrope","type":"Missile","power":33750000},{"name":"ASSASSIN428","type":"Missile","power":32200000},{"name":"atEr","type":"Missile","power":30640000},{"name":"Arturlion","type":"Missile","power":29910000},{"name":"ENIGMA31415","type":"Missile","power":29490000},{"name":"CassAkaza","type":"Missile","power":28910000},{"name":"SilentBG","type":"Missile","power":28860000},{"name":"colludo","type":"Missile","power":28810000},{"name":"Aspackad","type":"Tank","power":131560000},{"name":"Yugo Léliatrope","type":"Tank","power":75040000},{"name":"ENIGMA31415","type":"Tank","power":39940000},{"name":"atEr","type":"Tank","power":39490000},{"name":"SilentBG","type":"Tank","power":39420000},{"name":"colludo","type":"Tank","power":39040000},{"name":"Ophicat ᓚᘏᗢ","type":"Tank","power":37140000},{"name":"CassAkaza","type":"Tank","power":37010000},{"name":"Kinedaniii","type":"Tank","power":35170000},{"name":"N6C6R6","type":"Tank","power":34690000}];const $=id=>document.getElementById(id);const parsePower=v=>{const raw=String(v??'').trim().replace(/\s/g,'').replace(',','.');if(!raw)return 0;const m=raw.match(/^([\d.]+)([KMB])?$/i);if(!m)return 0;const n=Number(m[1]);return Number.isFinite(n)&&n>0?n*({K:1e3,M:1e6,B:1e9}[m[2]?.toUpperCase()]||1e6):0};const fmt=n=>n>=1e9?(n/1e9).toFixed(2)+'B':n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':String(Math.round(n));const node=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e};function avatar(p,small=false){const e=node('div',small?'mini-avatar':'portrait',p.name?.trim()?.[0]?.toUpperCase()||'?');let url=p.default_avatar==='hola'&&p.hola_avatar?p.hola_avatar:p.uploaded_avatar||p.avatar||p.hola_avatar;if(url&&/^(https:\/\/|data:image\/)/i.test(url)){const img=new Image();img.alt='';img.loading='lazy';img.referrerPolicy='no-referrer';img.onload=()=>{e.textContent='';e.append(img)};img.src=url}return e}function card(p,rank){const c=node('article','champion');c.dataset.rank=rank;c.append(node('div','crown',rank===1?'👑':rank===2?'✦':'◆'),avatar(p),node('div','rank','#'+rank),node('div','name',p.name),node('div','power',fmt(p.power)));return c}function entry(p,rank){const e=node('div','entry');e.append(node('span','position',String(rank).padStart(2,'0')),avatar(p,true),node('span','name',p.name),node('span','power',fmt(p.power)));return e}function render(rows){const wrap=$('rankings');wrap.replaceChildren();for(const [type,id,symbol,title]of sections){const best=new Map();for(const p of rows){for(let i=1;i<=3;i++){if(String(p['squad'+i+'_type']||'').toLowerCase()!==type.toLowerCase())continue;const power=parsePower(p['squad'+i+'_power']);if(!power||!p.name)continue;const k=p.name.trim().toLocaleLowerCase();if(!best.has(k)||best.get(k).power<power)best.set(k,{...p,power})}}const ranked=[...best.values()].sort((a,b)=>b.power-a.power||a.name.localeCompare(b.name)).slice(0,10);const section=node('section','category');section.id=id;section.dataset.type=type;const head=node('header','category-head');const emblem=node('span','symbol');const emblemImage=document.createElement('img');emblemImage.src=symbol;emblemImage.alt='';emblem.append(emblemImage);head.append(emblem,node('h2','',title),node('p','',ranked.length?'TOP '+ranked.length+' · HOLa':'HOLa · TOP 10'));section.append(head);if(!ranked.length){section.append(node('p','empty','Todavía no hay squads registrados en esta categoría.'));wrap.append(section);continue}const podium=node('div','podium');for(const rank of [2,1,3]){if(ranked[rank-1])podium.append(card(ranked[rank-1],rank));else podium.append(node('div'))}section.append(podium);if(ranked.length>3){section.append(node('h3','rest-title','PUESTOS 4–10'));const rest=node('div','rest');ranked.slice(3).forEach((p,i)=>rest.append(entry(p,i+4)));section.append(rest)}wrap.append(section)}$('status').hidden=true;wrap.hidden=false}async function load(){try{const r=await fetch(base,{headers:{apikey:key},cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const rows=await r.json();if(!Array.isArray(rows))throw Error('Invalid data');render(rows)}catch(err){console.warn('Live ranking unavailable; showing last verified rankings',err)}}const initial=snapshot.map(p=>({name:p.name,squad1_type:p.type,squad1_power:String(p.power/1e6)+'M'}));render(initial);load()})();
