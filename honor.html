<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#04111f">
  <title>HOLa · Muro de Honor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/honor.css?v=20261001-thp-1">
</head>
<body>
  <video class="honor-video-bg" autoplay muted loop playsinline preload="metadata" poster="assets/honor-temple-poster.jpg" aria-hidden="true">
    <source src="assets/honor-temple-bg.mp4" type="video/mp4">
  </video>
  <main class="honor-app">
    <header class="honor-header">
      <a class="back" href="index.html" aria-label="Volver">‹</a>
      <img class="honor-logo" src="assets/logo-hola.webp" alt="HOLa">
      <button class="language" id="languageButton" type="button" aria-label="Cambiar idioma"><span id="languageFlag">🇪🇸</span></button>
      <p class="eyebrow">HEROES OF LAST AREA · S3</p>
      <h1 data-i18n="title">MURO DE HONOR</h1>
    </header>
    <nav class="squad-tabs" aria-label="Clasificaciones">
      <button class="squad-tab active" data-index="0" type="button"><img src="assets/icon-tank-custom.png" alt=""><span data-i18n="tank">TANQUES</span></button>
      <button class="squad-tab" data-index="1" type="button"><img src="assets/icon-missile-custom.png" alt=""><span data-i18n="missile">MISILES</span></button>
      <button class="squad-tab" data-index="2" type="button"><img src="assets/icon-air-custom.png" alt=""><span data-i18n="aircraft">AÉREOS</span></button>
    <button class="squad-tab" data-index="3" type="button"><span class="thp-tab-icon" aria-hidden="true">✦</span><span data-i18n="thp">TOP 10 THP</span></button>
    </nav>
    <div id="status" class="status" role="status" data-i18n="loading">Abriendo el salón de los campeones…</div>
    <div class="rankings" id="rankings" hidden></div>
    <div class="carousel-control" id="carouselControl" hidden>
      <button id="previous" type="button" aria-label="Anterior">‹</button>
      <div class="dots"><i class="active"></i><i></i><i></i><i></i></div>
      <button id="next" type="button" aria-label="Siguiente">›</button>
    </div>
  </main>
  <div class="language-sheet" id="languageSheet" hidden>
    <button type="button" data-lang="es">🇪🇸 Español</button><button type="button" data-lang="en">🇬🇧 English</button>
    <button type="button" data-lang="fr">🇫🇷 Français</button><button type="button" data-lang="de">🇩🇪 Deutsch</button>
    <button type="button" data-lang="ro">🇷🇴 Română</button><button type="button" data-lang="pt">🇵🇹 Português</button>
    <button type="button" data-lang="uk">🇺🇦 Українська</button><button type="button" data-lang="it">🇮🇹 Italiano</button>
    <button type="button" data-lang="pl">🇵🇱 Polski</button><button type="button" data-lang="tr">🇹🇷 Türkçe</button>
    <button type="button" data-lang="ru">🇷🇺 Русский</button>
  </div>
  <script src="js/honor-genders.js?v=20260927-1"></script>
<script src="js/honor.js?v=20261001-thp-1"></script>
</body>
</html>
