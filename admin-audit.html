</style></head><body><main class="wrap"><div class="top"><a class="back" href="admin-center-hola_login.html">← Admin</a><select class="lang" id="lang"></select><img class="logo" src="hola-s3-logo.png" alt="HOLa"></div><section class="panel"><h1 id="title">Historial de administración</h1><p class="hint" id="intro">Registro protegido de los cambios realizados por administradores R4/R5.</p><div class="filters"><select id="adminFilter"></select><select id="moduleFilter"></select><select id="actionFilter"></select></div></section><section class="panel"><div id="status" class="hint">Cargando historial…</div><div id="list"></div><button class="more" id="more" hidden>Cargar más</button></section></main>

function options(){const keep={a:$('adminFilter').value,m:$('moduleFilter').value,x:$('actionFilter').value};$('adminFilter').innerHTML='<option value="">'+t('allAdmins')+'</option>';$('moduleFilter').innerHTML='<option value="">'+t('allModules')+'</option>';$('actionFilter').innerHTML='<option value="">'+t('allActions')+'</option><option value="INSERT">'+t('insert')+'</option><option value="UPDATE">'+t('update')+'</option><option value="DELETE">'+t('delete')+'</option>';return keep}
function apply(){document.documentElement.lang=lang;document.title='HOLa · '+t('title');$('title').textContent=t('title');$('intro').textContent=t('intro');$('more').textContent=t('more');options()}
for(const c of Object.keys(D)){const o=document.createElement('option');o.value=c;o.textContent=flags[c]+' '+D[c].name;$('lang').append(o)}$('lang').value=lang;$('lang').onchange=()=>{lang=$('lang').value;localStorage.setItem('hola-language',lang);apply();reset()};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(r){const verb=r.action==='INSERT'?t('insert'):r.action==='UPDATE'?t('update'):t('delete'),when=new Date(r.created_at).toLocaleString(lang==='en'?'en-GB':lang);return '<article class="entry"><div class="entry-head"><strong>'+esc(r.admin_name)+'</strong><span class="time">'+esc(when)+'</span></div><div class="meta"><span class="tag '+r.action+'">'+esc(verb)+'</span> '+esc(moduleName(r.table_name))+' · '+esc(JSON.stringify(r.record_key))+'</div><details><summary>'+esc(t('details'))+'</summary><pre>'+esc(JSON.stringify({before:r.old_data,after:r.new_data},null,2))+'</pre></details></article>'}
async function authorized(){const{data:{session}}=await sb.auth.getSession();if(!session)return false;const{data}=await sb.from('admin_users').select('user_id').eq('user_id',session.user.id).maybeSingle();return!!data}
async function load(){if(done)return;$('status').textContent=t('loading');let q=sb.from('admin_audit_log').select('*').order('created_at',{ascending:false}).range(offset,offset+49);if($('adminFilter').value)q=q.eq('admin_name',$('adminFilter').value);if($('moduleFilter').value)q=q.eq('table_name',$('moduleFilter').value);if($('actionFilter').value)q=q.eq('action',$('actionFilter').value);const{data,error}=await q;if(error){$('status').textContent=error.message;return}if(!offset){$('list').innerHTML=''}$('list').insertAdjacentHTML('beforeend',(data||[]).map(render).join(''));offset+=(data||[]).length;done=(data||[]).length<50;$('more').hidden=done;$('status').textContent=!offset?t('empty'):''}
async function fillFilters(){const{data}=await sb.from('admin_audit_log').select('admin_name,table_name').limit(1000);const admins=[...new Set((data||[]).map(x=>x.admin_name))].sort(),mods=[...new Set((data||[]).map(x=>x.table_name))].sort();for(const a of admins)$('adminFilter').insertAdjacentHTML('beforeend','<option>'+esc(a)+'</option>');for(const m of mods)$('moduleFilter').insertAdjacentHTML('beforeend','<option value="'+esc(m)+'">'+esc(moduleName(m))+'</option>')}
function reset(){offset=0;done=false;$('list').innerHTML='';fillFilters().then(load)}
