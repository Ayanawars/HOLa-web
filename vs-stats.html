<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5ead0"><title>HOLa · Estadísticas VS</title><style>:root{--ink:#123b5a;--muted:#706b60;--blue:#168fd1;--gold:#d5a229;--line:#e2c878;--green:#16a563;--red:#dc4c55;--orange:#f28b27}*{box-sizing:border-box}body{margin:0;background:#f6ecd2;color:var(--ink);font-family:Inter,system-ui,sans-serif}.page{max-width:920px;margin:auto;min-height:100vh;background:#fffaf0}.hero{height:185px;position:relative;background:linear-gradient(90deg,#063f65dc,#138ca777),url('hola-s3-header.png') center/cover;border-bottom:4px solid #e7bd4b}.back{position:absolute;left:16px;top:16px;color:#fff;font-size:34px;text-decoration:none}.logo{position:absolute;width:110px;left:50%;top:10px;transform:translateX(-50%)}.hero h1{position:absolute;left:0;right:0;bottom:36px;text-align:center;margin:0;color:#fff1c5;font:700 31px Georgia}.hero p{position:absolute;left:0;right:0;bottom:14px;text-align:center;margin:0;color:#fff;font-weight:700}.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:#073e61;color:#fff;border-bottom:2px solid var(--gold)}.tab{padding:12px 2px;text-align:center;font-size:12px;font-weight:800}.tab.active{background:#fff7df;color:var(--ink)}main{padding:12px 10px 32px}.searchbox{position:relative}.search{width:100%;height:55px;border:1px solid #c8c4b7;border-radius:16px;background:#fff;padding:0 18px;font-size:17px}.suggest{position:absolute;z-index:10;top:60px;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:15px;max-height:330px;overflow:auto;box-shadow:0 12px 30px #0002}.suggest button{width:100%;display:flex;align-items:center;gap:10px;padding:10px 13px;border:0;border-bottom:1px solid #eee;background:#fff;text-align:left;font-weight:800;color:var(--ink)}.mini{width:38px;height:38px;border-radius:50%;object-fit:cover}.hidden{display:none}.card{margin-top:14px;background:#fffdf7;border:1px solid var(--line);border-radius:19px;padding:14px;box-shadow:0 8px 24px #76551c1c}.profile{display:flex;align-items:center;gap:14px}.avatar{width:78px;height:78px;flex:0 0 78px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:#087ca7;border:4px double #e5b942;color:#fff;font:900 26px Georgia}.avatar img{width:100%;height:100%;object-fit:cover}.profile h2{margin:0;font-size:23px}.profile p{margin:5px 0;color:var(--muted);font-weight:700}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.stat{padding:10px 5px;border:1px solid #ead8aa;border-radius:12px;text-align:center;background:#fffaf0}.stat small{display:block;color:var(--muted);font-weight:700}.stat b{display:block;margin-top:4px;font-size:17px}.card h3{margin:0 0 12px;font:700 19px Georgia}.rings{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.ring{text-align:center}.circle{width:64px;height:64px;margin:auto;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--green) calc(var(--p)*1%),#ddd 0);position:relative}.circle:after{content:'';position:absolute;width:48px;height:48px;border-radius:50%;background:#fffdf7}.circle b{z-index:1}.ring small{display:block;margin-top:6px;font-size:11px;font-weight:800}.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mode{padding:0;overflow:hidden}.head{padding:10px 13px;color:#fff;font:700 18px Georgia}.save .head{background:#087ba7}.push .head{background:#c95820}.body{padding:12px}.line{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eee2c3;font-size:13px}.weeks{display:grid;gap:5px}.week{display:grid;grid-template-columns:58px 55px 1fr auto;gap:7px;align-items:center;font-size:12px}.pill{padding:4px;border-radius:7px;color:#fff;text-align:center;font-weight:900}.pill.save{background:var(--blue)}.pill.push{background:var(--orange)}.ok{color:var(--green);font-weight:900}.bad{color:var(--red);font-weight:900}.empty{text-align:center;padding:38px;color:var(--muted)}@media(max-width:520px){.modes{grid-template-columns:1fr}.rings{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:repeat(2,1fr)}}</style></head><body><div class="page"><header class="hero"><a class="back" href="vs.html">‹</a><img class="logo" src="hola-s3-logo.webp"><h1>ESTADÍSTICAS VS</h1><p>Historial individual de Versus</p></header><nav class="tabs"><div class="tab active">Jugador</div><div class="tab">Comparar</div><div class="tab">Alianza</div><div class="tab">Récords</div></nav><main><div class="searchbox"><input id="search" class="search" placeholder="Buscar jugador de HOLa..." autocomplete="off"><div id="suggest" class="suggest hidden"></div></div><div id="view"><div class="empty">Cargando datos VS...</div></div></main></div><script>const URL='https://ovybstpiomphrouvqxmf.supabase.co/rest/v1/',KEY='sb_publishable_gU5Wgy2NhdXcy23_TotF9g_LKthVmKV',MIN=7200000,TARGET=36000000,DAYS=[1,2,3,4,5];let players=[],scores=[];const search=document.getElementById('search'),suggest=document.getElementById('suggest'),view=document.getElementById('view');const key=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9\u00c0-\u024f]+/g,'');const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=n=>{n=+n||0;return n>=1e9?(n/1e9).toFixed(1)+'B':n>=1e6?(n/1e6).toFixed(1).replace('.0','')+'M':n.toLocaleString('es-ES')};const av=p=>p&&(p.hola_avatar||p.uploaded_avatar||p.avatar||p.default_avatar)||'';async function api(path){const r=await fetch(URL+path,{headers:{apikey:KEY,Authorization:'Bearer '+KEY}});if(!r.ok)throw new Error(await r.text());return r.json()}function group(name){const m=new Map(),k=key(name);scores.filter(s=>key(s.player_name)===k).forEach(s=>{if(!m.has(s.vs_date))m.set(s.vs_date,{date:s.vs_date,type:s.week_type||'push',d:{}});m.get(s.vs_date).d[+s.day]=+s.points||0});return[...m.values()].sort((a,b)=>a.date.localeCompare(b.date)).map(w=>{w.total=DAYS.reduce((a,d)=>a+(w.d[d]||0),0);w.complete=DAYS.every(d=>Object.prototype.hasOwnProperty.call(w.d,d));w.ok=w.complete&&DAYS.every(d=>w.d[d]>=MIN);return w})}function render(name){const p=players.find(x=>key(x.name)===key(name)),w=group(name),avatar=av(p),initials=name.split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase();if(!w.length){view.innerHTML=`<section class="card"><div class="profile"><div class="avatar">${avatar?`<img src="${esc(avatar)}">`:esc(initials)}</div><div><h2>${esc(name)}</h2><p>Sin historial VS guardado</p></div></div></section>`;return}const vals=w.flatMap(x=>DAYS.map(d=>x.d[d]).filter(v=>v!==undefined)),total=w.reduce((a,x)=>a+x.total,0),avgW=total/w.length,avgD=vals.reduce((a,b)=>a+b,0)/Math.max(1,vals.length),recD=Math.max(0,...vals),recW=Math.max(0,...w.map(x=>x.total)),passed=vals.filter(v=>v>=MIN).length,part=vals.filter(v=>v>0).length,under=vals.filter(v=>v<MIN).length,zeros=vals.filter(v=>v===0).length,save=w.filter(x=>x.type==='save'),push=w.filter(x=>x.type==='push'),perfect=save.filter(x=>x.ok),bestSave=perfect.slice().sort((a,b)=>Math.abs(a.total-TARGET)-Math.abs(b.total-TARGET))[0],avgSave=save.reduce((a,x)=>a+x.total,0)/Math.max(1,save.length),avgPush=push.reduce((a,x)=>a+x.total,0)/Math.max(1,push.length),bestPush=Math.max(0,...push.map(x=>x.total));let streak=0,best=0;vals.forEach(v=>{streak=v>=MIN?streak+1:0;best=Math.max(best,streak)});view.innerHTML=`<section class="card"><div class="profile"><div class="avatar">${avatar?`<img src="${esc(avatar)}" onerror="this.parentNode.textContent='${esc(initials)}'">`:esc(initials)}</div><div><h2>${esc(name)}</h2><p>HOLa · Perfil VS · ${w.length} semanas</p></div></div><div class="grid"><div class="stat"><small>Puntos totales</small><b>${fmt(total)}</b></div><div class="stat"><small>Media semanal</small><b>${fmt(avgW)}</b></div><div class="stat"><small>Media diaria</small><b>${fmt(avgD)}</b></div><div class="stat"><small>Récord diario</small><b>${fmt(recD)}</b></div><div class="stat"><small>Récord semanal</small><b>${fmt(recW)}</b></div><div class="stat"><small>Mejor racha</small><b>${best} días</b></div></div></section><section class="card"><h3>Cumplimiento y participación</h3><div class="rings">${[['Participación',part],['Cumplimiento',passed],['Días < 7,2M',under],['Días con 0',zeros]].map((x,i)=>`<div class="ring"><div class="circle" style="--p:${i<2?Math.round(x[1]*100/Math.max(1,vals.length)):Math.round(x[1]*100/Math.max(1,vals.length))}"><b>${i<2?Math.round(x[1]*100/Math.max(1,vals.length))+'%':x[1]}</b></div><small>${x[0]}</small></div>`).join('')}</div></section><div class="modes"><section class="card mode save"><div class="head">Semana SAVE</div><div class="body"><div class="line"><span>Semanas SAVE</span><b>${save.length}</b></div><div class="line"><span>Semanas perfectas</span><b>${perfect.length}</b></div><div class="line"><span>Media semanal</span><b>${fmt(avgSave)}</b></div><div class="line"><span>Mejor SAVE</span><b>${bestSave?fmt(bestSave.total):'—'}</b></div></div></section><section class="card mode push"><div class="head">Semana PUSH</div><div class="body"><div class="line"><span>Semanas PUSH</span><b>${push.length}</b></div><div class="line"><span>Media semanal</span><b>${fmt(avgPush)}</b></div><div class="line"><span>Mejor semana</span><b>${fmt(bestPush)}</b></div></div></section></div><section class="card"><h3>Últimas 8 semanas</h3><div class="weeks">${w.slice(-8).reverse().map(x=>`<div class="week"><span>${x.date.slice(5)}</span><span class="pill ${x.type}">${x.type.toUpperCase()}</span><b>${fmt(x.total)}</b><span class="${x.ok?'ok':'bad'}">${x.ok?'Cumple':'No cumple'}</span></div>`).join('')}</div></section>`}function show(){const q=key(search.value),a=q?players.filter(p=>key(p.name).includes(q)).slice(0,15):[];suggest.innerHTML=a.map(p=>`<button data-n="${esc(p.name)}">${av(p)?`<img class="mini" src="${esc(av(p))}">`:''}<span>${esc(p.name)}</span></button>`).join('');suggest.classList.toggle('hidden',!a.length);suggest.querySelectorAll('button').forEach(b=>b.onclick=()=>{search.value=b.dataset.n;suggest.classList.add('hidden');render(b.dataset.n)})}search.addEventListener('input',show);async function init(){try{[players,scores]=await Promise.all([api('players?select=name,avatar,uploaded_avatar,hola_avatar,default_avatar&order=name.asc'),api('vs_scores?select=player_name,day,points,week_type,vs_date&day=gte.1&day=lte.6&order=vs_date.asc')]);view.innerHTML=`<div class="empty">${players.length} jugadores cargados. Busca un jugador para ver sus estadísticas.</div>`;const a=players.find(p=>key(p.name)===key('Ayana wars'));if(a){search.value=a.name;render(a.name)}}catch(e){console.error(e);view.innerHTML='<div class="empty">Error al cargar datos. Recarga la página.</div>'}}init();</script></body></html>
