<script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const sb=createClient('https://ovybstpiomphrouvqxmf.supabase.co','sb_publishable_gU5Wgy2NhdXcy23_TotF9g_LKthVmKV');const MIN=7200000,DAYS=[1,2,3,4,5],TARGET=36000000;let players=[],scores=[];const key=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^\p{L}\p{N}]+/gu,'');const fmt=n=>{n=Number(n)||0;return n>=1e9?(n/1e9).toFixed(1)+'B':n>=1e6?(n/1e6).toFixed(1).replace('.0','')+'M':n.toLocaleString('es-ES')};const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function mondayStr(d){const x=new Date(d+'T12:00:00');return x.toLocaleDateString('es-ES',{day:'2-digit',month:'short'})}function groupPlayer(name){const k=key(name),map=new Map;for(const s of scores.filter(x=>key(x.player_name)===k)){const wk=s.vs_date;if(!map.has(wk))map.set(wk,{date:wk,type:s.week_type||'push',daily:{}});map.get(wk).daily[+s.day]=+s.points||0}return[...map.values()].sort((a,b)=>a.date.localeCompare(b.date)).map(w=>{w.total=DAYS.reduce((a,d)=>a+(w.daily[d]||0),0);w.complete=DAYS.every(d=>Object.hasOwn(w.daily,d));w.complies=w.complete&&DAYS.every(d=>(w.daily[d]||0)>=MIN);return w})}function render(name){const w=groupPlayer(name);if(!w.length){view.innerHTML='<div class="empty">No hay historial VS guardado para '+esc(name)+'.</div>';return}const vals=w.flatMap(x=>DAYS.map(d=>x.daily[d]).filter(v=>v!==undefined)),tot=w.reduce((a,x)=>a+x.total,0),recDay=Math.max(0,...vals),recWeek=Math.max(0,...w.map(x=>x.total)),avgWeek=tot/w.length,avgDay=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0,recorded=vals.length,participated=vals.filter(v=>v>0).length,passed=vals.filter(v=>v>=MIN).length,zeros=vals.filter(v=>v===0).length,under=vals.filter(v=>v<MIN).length,save=w.filter(x=>x.type==='save'),push=w.filter(x=>x.type==='push'),perfectSave=save.filter(x=>x.complies),bestSave=perfectSave.slice().sort((a,b)=>Math.abs(a.total-TARGET)-Math.abs(b.total-TARGET))[0],avgSave=save.length?save.reduce((a,x)=>a+x.total,0)/save.length:0,avgExcess=perfectSave.length?perfectSave.reduce((a,x)=>a+(x.total-TARGET),0)/perfectSave.length:0,avgPush=push.length?push.reduce((a,x)=>a+x.total,0)/push.length:0,bestPush=Math.max(0,...push.map(x=>x.total)),bestPushDay=Math.max(0,...push.flatMap(x=>Object.values(x.daily)));let streak=0,bestStreak=0;for(const v of vals){streak=v>=MIN?streak+1:0;bestStreak=Math.max(bestStreak,streak)}const player=players.find(p=>key(p.name)===key(name));const avatarUrl=player?.avatar||'';const initials=name.split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase();const avatarHtml=avatarUrl?`<img src="${esc(avatarUrl)}" alt="Avatar de ${esc(name)}" onerror="this.remove();this.parentElement.textContent='${esc(initials)}'">`:esc(initials);const dayAvg=DAYS.map(d=>{const a=w.map(x=>x.daily[d]).filter(v=>v!==undefined);return a.length?a.reduce((x,y)=>x+y,0)/a.length:0});const last=w.slice(-12),max=Math.max(1,...last.map(x=>x.total));view.innerHTML=`<section class="profile"><div class="profile-top"><div class="avatar">${avatarHtml}</div><div class="who"><h2>${esc(name)}</h2><p>HOLa · Perfil VS</p><div class="weeks">▣ Semanas registradas: ${w.length}</div></div></div><div class="metrics"><div class="metric"><span>Puntos totales</span><b>${fmt(tot)}</b></div><div class="metric"><span>Media semanal</span><b>${fmt(avgWeek)}</b></div><div class="metric"><span>Media diaria</span><b>${fmt(avgDay)}</b></div><div class="metric"><span>Récord diario</span><b>${fmt(recDay)}</b></div><div class="metric"><span>Récord semanal</span><b>${fmt(recWeek)}</b></div><div class="metric"><span>Mejor racha</span><b>${bestStreak} días</b></div></div></section><div class="two"><section class="section"><h3>🎯 Cumplimiento y participación</h3><div class="rings"><div class="ring"><div class="circle" style="--p:${recorded?100*participated/recorded:0}"><b>${recorded?Math.round(100*participated/recorded):0}%</b></div><small>Participación</small></div><div class="ring"><div class="circle" style="--p:${recorded?100*passed/recorded:0}"><b>${recorded?Math.round(100*passed/recorded):0}%</b></div><small>Cumplimiento</small></div><div class="ring"><div class="circle" style="--p:${recorded?100*under/recorded:0}"><b>${under}</b></div><small>Días &lt; 7,2M</small></div><div class="ring"><div class="circle" style="--p:${recorded?100*zeros/recorded:0}"><b>${zeros}</b></div><small>Días con 0</small></div></div></section><section class="section"><h3>👑 Posiciones en ranking</h3><div class="rankcards"><div class="rankcard"><div class="medal">🥇</div><span>Top 1</span><b id="top1">—</b></div><div class="rankcard"><div class="medal">🥈</div><span>Top 3</span><b id="top3">—</b></div><div class="rankcard"><div class="medal">🏅</div><span>Top 10</span><b id="top10">—</b></div></div></section></div><div class="split"><section class="section mode save"><div class="mode-head">🛡 Semana SAVE</div><div class="mode-body"><div class="statline"><span>Semanas SAVE</span><b>${save.length}</b></div><div class="statline"><span>Semanas perfectas</span><b class="good">${perfectSave.length}</b></div><div class="statline"><span>Promedio semanal</span><b>${fmt(avgSave)}</b></div><div class="statline"><span>Mejor SAVE</span><b>${bestSave?fmt(bestSave.total):'—'}</b></div><div class="statline"><span>Exceso medio*</span><b>${perfectSave.length?(avgExcess>=0?'+':'')+fmt(avgExcess):'—'}</b></div></div></section><section class="section mode push"><div class="mode-head">🔥 Semana PUSH</div><div class="mode-body"><div class="statline"><span>Semanas PUSH</span><b>${push.length}</b></div><div class="statline"><span>Promedio semanal</span><b>${fmt(avgPush)}</b></div><div class="statline"><span>Mejor semana</span><b>${fmt(bestPush)}</b></div><div class="statline"><span>Mejor día</span><b>${fmt(bestPushDay)}</b></div></div></section></div><section class="section"><h3>📈 Evolución semanal</h3><div class="chart">${last.map((x,i)=>`<div class="bar ${x.type==='push'?'pushbar':''}" title="${esc(x.type.toUpperCase())} · ${fmt(x.total)}" style="height:${Math.max(5,100*x.total/max)}%"><i>S${i+1}</i></div>`).join('')}</div></section><div class="bottomgrid"><section class="section"><h3>📊 Promedio por día</h3>${DAYS.map((d,i)=>`<div class="statline"><span>${['Lunes','Martes','Miércoles','Jueves','Viernes'][i]}</span><b>${fmt(dayAvg[i])}</b></div>`).join('')}</section><section class="section"><h3>🗓 Últimas 8 semanas</h3><div class="weeklist">${w.slice(-8).reverse().map(x=>`<div class="weekrow"><span>${mondayStr(x.date)}</span><span class="pill ${x.type}">${x.type.toUpperCase()}</span><b>${fmt(x.total)}</b><span class="${x.complies?'ok':'bad'}">${x.complies?'✓ Cumple':'✕ No cumple'}</span></div>`).join('')}</div></section></div>`;calcRanks(name)}async function calcRanks(name){let a=0,b=0,c=0;const dates=[...new Set(scores.map(x=>x.vs_date))];for(const date of dates){const typeRows=scores.filter(x=>x.vs_date===date),map=new Map;for(const s of typeRows){const k=key(s.player_name);if(!map.has(k))map.set(k,{name:s.player_name,d:{}});map.get(k).d[+s.day]=+s.points||0}let rows=[...map.values()].map(x=>({...x,total:DAYS.reduce((z,d)=>z+(x.d[d]||0),0),ok:DAYS.every(d=>Object.hasOwn(x.d,d)&&x.d[d]>=MIN)}));const wt=typeRows.filter(x=>x.week_type==='save').length>typeRows.filter(x=>x.week_type==='push').length?'save':'push';if(wt==='save')rows=rows.filter(x=>x.ok).sort((x,y)=>Math.abs(x.total-TARGET)-Math.abs(y.total-TARGET));else rows.sort((x,y)=>y.total-x.total);const pos=rows.findIndex(x=>key(x.name)===key(name))+1;if(pos===1)a++;if(pos&&pos<=3)b++;if(pos&&pos<=10)c++}top1.textContent=a;top3.textContent=b;top10.textContent=c}function showSuggestions(q=''){const k=key(q),list=players.filter(p=>!k||key(p.name).includes(k)).slice(0,12);suggestions.innerHTML=list.map(p=>`<button type="button" data-name="${esc(p.name)}">${esc(p.name)}</button>`).join('');suggestions.classList.toggle('hidden',!list.length);suggestions.querySelectorAll('button').forEach(b=>b.onclick=()=>{search.value=b.dataset.name;suggestions.classList.add('hidden');render(b.dataset.name)})}search.oninput=()=>showSuggestions(search.value);search.onfocus=()=>showSuggestions(search.value);document.addEventListener('click',e=>{if(!e.target.closest('.search-wrap'))suggestions.classList.add('hidden')});async function load(){const[p,s]=await Promise.all([sb.from('players').select('name,avatar').order('name'),sb.from('vs_scores').select('player_name,day,points,week_type,vs_date').gte('day',1).lte('day',6).order('vs_date')]);if(p.error)throw p.error;if(s.error)throw s.error;players=p.data||[];scores=s.data||[];const first=players.find(x=>key(x.name)==='ayanawars');if(first){search.value=first.name;render(first.name)}}load().catch(e=>{console.error(e);view.innerHTML='<div class="empty">No se pudieron cargar las estadísticas.</div>'});
</script></body></html>
