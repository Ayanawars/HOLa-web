0,DAYS=[1,2,3,4,5],TARGET=36000000;let players=[],scores=[];const key=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^\p{L}\p{N}]+/gu,'');const fmt=n=>{n=Number(n)||0;return n>=1e9?(n/1e9).toFixed(1)+'B':n>=1e6?(n/1e6).toFixed(1).replace('.0','')+'M':n.toLocaleString('es-ES')};const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const icons={user:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c.8-5 3.5-7 8-7s7.2 2 8 7"/></svg>',compare:'<svg viewBox="0 0 24 24"><path d="M7 4v16M17 4v16M3 8l4-4 4 4M13 16l4 4 4-4"/></svg>',team:'<svg viewBox="0 0 24 24"><circle cx="8" cy="9" r="3"/><circle cx="17" cy="10" r="2.5"/><path d="M2 20c.5-4 2.7-6 6-6s5.5 2 6 6M14 15c3.8-.6 6.3 1.1 7 4"/></svg>',trophy:'<svg viewBox="0 0 24 24"><path d="M7 4h10v4c0 5-2 8-5 8S7 13 7 8V4Z"/><path d="M7 6H3v2c0 3 2 5 5 5M17 6h4v2c0 3-2 5-5 5M12 16v4M8 21h8"/></svg>',search:'<svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>',calendar:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/></svg>',target:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>',rank:'<svg viewBox="0 0 24 24"><path d="M6 4h12v4c0 4-2.5 7-6 7S6 12 6 8V4Z"/><path d="M12 15v5M8 21h8"/></svg>',shield:'<svg viewBox="0 0 24 24"><path d="M12 3 20 6v6c0 5-3 8-8 10-5-2-8-5-8-10V6l8-3Z"/><path d="m8 12 2.5 2.5L16 9"/></svg>',bolt:'<svg viewBox="0 0 24 24"><path d="m13 2-8 12h7l-1 8 8-12h-7l1-8Z"/></svg>',chart:'<svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20V7"/></svg>'};function injectIcons(root=document){root.querySelectorAll('[data-i]').forEach(x=>x.innerHTML=icons[x.dataset.i]||'')}injectIcons();function avatarOf(p){return p?.hola_avatar||p?.uploaded_avatar||p?.avatar||p?.default_avatar||''}function groupPlayer(name){const k=key(name),map=new Map;for(const s of scores.filter(x=>key(x.player_name)===k)){const wk=s.vs_date;if(!map.has(wk))map.set(wk,{date:wk,type:s.week_type||'push',daily:{}});map.get(wk).daily[+s.day]=+s.points||0}return[...map.values()].sort((a,b)=>a.date.localeCompare(b.date)).map(w=>{w.total=DAYS.reduce((a,d)=>a+(w.daily[d]||0),0);w.complete=DAYS.every(d=>Object.hasOwn(w.daily,d));w.complies=w.complete&&DAYS.every(d=>(w.daily[d]||0)>=MIN);return w})}function render(name){const w=groupPlayer(name),p=players.find(x=>key(x.name)===key(name));if(!w.length){view.innerHTML='<div class="empty">No hay historial VS guardado para '+esc(name)+'.</div>';return}const vals=w.flatMap(x=>DAYS.map(d=>x.daily[d]).filter(v=>v!==undefined)),tot=w.reduce((a,x)=>a+x.total,0),recDay=Math.max(0,...vals),recWeek=Math.max(0,...w.map(x=>x.total)),avgWeek=tot/w.length,avgDay=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0,recorded=vals.length,participated=vals.filter(v=>v>0).length,passed=vals.filter(v=>v>=MIN).length,zeros=vals.filter(v=>v===0).length,under=vals.filter(v=>v<MIN).length,save=w.filter(x=>x.type==='save'),push=w.filter(x=>x.type==='push'),perfectSave=save.filter(x=>x.complies),bestSave=perfectSave.slice().sort((a,b)=>Math.abs(a.total-TARGET)-Math.abs(b.total-TARGET))[0],avgSave=save.length?save.reduce((a,x)=>a+x.total,0)/save.length:0,avgExcess=perfectSave.length?perfectSave.reduce((a,x)=>a+(x.total-TARGET),0)/perfectSave.length:0,avgPush=push.length?push.reduce((a,x)=>a+x.total,0)/push.length:0,bestPush=Math.max(0,...push.map(x=>x.total)),bestPushDay=Math.max(0,...push.flatMap(x=>Object.values(x.daily)));let streak=0,bestStreak=0;for(const v of vals){streak=v>=MIN?streak+1:0;bestStreak=Math.max(bestStreak,streak)}const initials=name.split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase(),av=avatarOf(p),dayAvg=DAYS.map(d=>{const a=w.map(x=>x.daily[d]).filter(v=>v!==undefined);return a.length?a.reduce((x,y)=>x+y,0)/a.length:0}),last=w.slice(-12),max=Math.max(1,.. ction class="section mode save"><div class="mode-head"><span class="ico" data-i="shield"></span>SAVE</div><div class="mode-body"><div class="statline"><span>Semanas</span><b>${save.length}</b></div><div class="statline"><span>Semanas perfectas</span><b class="good">${perfectSave.length}</b></div><div class="statline"><span>Media semanal</span><b>${fmt(avgSave)}</b></div><div class="statline"><span>Mejor SAVE</span><b>${bestSave?fmt(bestSave.total):'—'}</b></div><div class="statline"><span>Exceso medio*</span><b>${perfectSave.length?fmt(avgExcess):'—'}</b></div></div></section><section class="section mode push"><div class="mode-head"><span class="ico" data-i="bolt"></span>PUSH</div><div class="mode-body"><div class="statline"><span>Semanas</span><b>${push.length}</b></div><div class="statline"><span>Media semanal</span><b>${fmt(avgPush)}</b></div><div class="statline"><span>Mejor semana</span><b>${fmt(bestPush)}</b></div><div class="statline"><span>Mejor día</span><b>${fmt(bestPushDay)}</b></div></div></section></div><section class="section"><h3><span class="ico" data-i="chart"></span>Evolución semanal</h3><div class="chart">${last.map((x,i)=>`<div class="bar ${x.type==='push'?'pushbar':''}" style="height:${Math.max(5,100*x.total/max)}%" title="${fmt(x.total)}"><i>S${i+1}</i></div>`).join('')}</div></section><div class="bottomgrid"><section class="section"><h3>Promedio por día</h3>${DAYS.map((d,i)=>`<div class="statline"><span>${['Lunes','Martes','Miércoles','Jueves','Viernes'][i]}</span><b>${fmt(dayAvg[i])}</b></div>`).join('')}</section><section class="section"><h3>Últimas 8 semanas</h3><div class="weeklist">${w.slice(-8).reverse().map(x=>`<div class="weekrow"><span class="pill ${x.type}">${x.type.toUpperCase()}</span><span>${x.date.slice(5)}</span><b>${fmt(x.total)}</b><span class="${x.complies?'ok':'bad'}">${x.complies?'Cumple':'No cumple'}</span></div>`).join('')}</div></section></div>`;injectIcons(view);rankCounts(name,w)}async function rankCounts(name,weeks){let a=0,b=0,c=0;for(const wk of weeks){const rows=scores.filter(s=>s.vs_date===wk.date&&DAYS.includes(+s.day)),m=new Map;for(const s of rows)m.set(key(s.player_name),(m.get(key(s.player_name))||0)+(+s.points||0));const sorted=[...m].sort((x,y)=>y[1]-x[1]),pos=sorted.findIndex(x=>x[0]===key(name))+1;if(pos===1)a++;if(pos>0&&pos<=3)b++;if(pos>0&&pos<=10)c++}if(top1)top1.textContent=a;if(top3)top3.textContent=b;if(top10)top10.textContent=c}function show(q=''){const list=players.filter(p=>key(p.name).includes(key(q))).slice(0,12);suggestions.innerHTML=list.map(p=>`<button type="button" data-name="${esc(p.name)}">${esc(p.name)}</button>`).join('');suggestions.classList.toggle('hidden',!q||!list.length);suggestions.querySelectorAll('button').forEach(b=>b.onclick=()=>{search.value=b.dataset.name;suggestions.classList.add('hidden');render(b.dataset.name)})}search.oninput=()=>show(search.value);search.onfocus=()=>{if(search.value)show(search.value)};document.addEventListener('click',e=>{if(!e.target.closest('.search-wrap'))suggestions.classList.add('hidden')});async function load(){const[a,b]=await Promise.all([sb.from('players').select('name,avatar,uploaded_avatar,hola_avatar,default_avatar').order('name'),sb.from('vs_scores').select('player_name,day,points,week_type,vs_date').gte('day',1).lte('day',6)]);players=a.data||[];scores=b.data||[];if(a.error||b.error)console.error(a.error||b.error)}load();</script></body></html>
