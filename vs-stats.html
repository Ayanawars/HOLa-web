<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5ead0"><title>HOLa · Estadísticas VS</title><style>:root{--cream:#fffaf0;--ink:#123b5a;--muted:#6f6a5f;--blue:#168fd1;--navy:#064c75;--gold:#d5a229;--line:#e2c878;--green:#16a563;--red:#dc4c55;--orange:#f28b27;--shadow:0 10px 28px rgba(92,65,20,.14)}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#f8efd8}.page{width:min(100%,920px);margin:auto;min-height:100svh;background:#fffaf0}.hero{height:185px;position:relative;background:#07587e;border-bottom:4px solid #e7bd4b}.back{position:absolute;left:16px;top:16px;color:white;font-size:32px;text-decoration:none}.hero h1{position:absolute;left:0;right:0;bottom:40px;margin:0;text-align:center;font-family:Georgia;color:#fff2c9;font-size:32px}.hero p{position:absolute;left:0;right:0;bottom:16px;margin:0;text-align:center;color:white;font-weight:700}.content{padding:14px}.search-wrap{position:relative}.search{width:100%;height:56px;border-radius:16px;border:1px solid #c9c8c3;background:white;padding:0 18px;font-size:17px}.suggestions{position:absolute;z-index:20;top:61px;left:0;right:0;background:white;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);max-height:340px;overflow:auto}.suggestions button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:white;padding:12px 14px;border-bottom:1px solid #eee;text-align:left;color:var(--ink);font-weight:750}.mini{width:38px;height:38px;border-radius:50%;object-fit:cover;background:#eee}.hidden{display:none!important}.profile,.section{margin-top:14px;border:1px solid var(--line);border-radius:20px;background:#fff;box-shadow:var(--shadow);padding:16px}.profile-top{display:flex;gap:14px;align-items:center}.avatar{width:82px;height:82px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:#087ca7;border:4px double #e5b942;color:white;font:900 26px Georgia}.avatar img{width:100%;height:100%;object-fit:cover}.who h2{margin:0;font-size:24px}.who p{margin:5px 0;color:var(--muted);font-weight:700}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.metric{background:#fffaf0;border:1px solid #ead8aa;border-radius:13px;padding:11px 6px;text-align:center}.metric span{display:block;color:var(--muted);font-size:11px}.metric b{display:block;margin-top:4px;font-size:18px}.empty{text-align:center;padding:38px;color:var(--muted)}.week{display:grid;grid-template-columns:70px 1fr auto;gap:8px;padding:9px 0;border-bottom:1px solid #eee;align-items:center}.pill{border-radius:8px;padding:4px 7px;color:white;text-align:center;font-size:11px;font-weight:900}.save{background:#168fd1}.push{background:#f28b27}.ok{color:#16a563}.bad{color:#dc4c55}@media(max-width:390px){.metrics{grid-template-columns:repeat(2,1fr)}}</style></head><body><div class="page"><header class="hero"><a class="back" href="vs.html">‹</a><h1>ESTADÍSTICAS VS</h1><p>Historial individual de Versus</p></header><main class="content"><div class="search-wrap"><input id="search" class="search" placeholder="Buscar jugador de HOLa..." autocomplete="off"><div id="suggestions" class="suggestions hidden"></div></div><div id="view"><div class="empty">Busca y selecciona un jugador para ver sus estadísticas VS.</div></div></main></div><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const sb=createClient('https://ovybstpiomphrouvqxmf.supabase.co','sb_publishable_gU5Wgy2NhdXcy23_TotF9g_LKthVmKV');const MIN=7200000,DAYS=[1,2,3,4,5];let players=[],scores=[];const $=id=>document.getElementById(id),search=$('search'),suggestions=$('suggestions'),view=$('view');const key=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^\p{L}\p{N}]+/gu,'');const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=n=>{n=Number(n)||0;return n>=1e9?(n/1e9).toFixed(1)+'B':n>=1e6?(n/1e6).toFixed(1).replace('.0','')+'M':n.toLocaleString('es-ES')};const avatar=p=>p?.hola_avatar||p?.uploaded_avatar||p?.avatar||p?.default_avatar||'';function weeksFor(name){const m=new Map,k=key(name);scores.filter(s=>key(s.player_name)===k).forEach(s=>{const d=s.vs_date;if(!m.has(d))m.set(d,{date:d,type:s.week_type||'push',daily:{}});m.get(d).daily[+s.day]=+s.points||0});return[...m.values()].sort((a,b)=>a.date.localeCompare(b.date)).map(w=>{w.total=DAYS.reduce((a,d)=>a+(w.daily[d]||0),0);w.complete=DAYS.every(d=>Object.hasOwn(w.daily,d));w.complies=w.complete&&DAYS.every(d=>(w.daily[d]||0)>=MIN);return w})}function render(name){const p=players.find(x=>key(x.name)===key(name)),w=weeksFor(name),av=avatar(p),ini=name.slice(0,2).toUpperCase();if(!w.length){view.innerHTML=`<section class="profile"><div class="profile-top"><div class="avatar">${av?`<img src="${esc(av)}">`:esc(ini)}</div><div class="who"><h2>${esc(name)}</h2><p>HOLa · Sin historial VS guardado</p></div></div></section>`;return}const vals=w.flatMap(x=>DAYS.map(d=>x.daily[d]).filter(v=>v!==undefined)),total=w.reduce((a,x)=>a+x.total,0),avg=total/w.length,dayavg=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0,rec=Math.max(0,...vals),recw=Math.max(0,...w.map(x=>x.total));view.innerHTML=`<section class="profile"><div class="profile-top"><div class="avatar">${av?`<img src="${esc(av)}" onerror="this.remove()">`:esc(ini)}</div><div class="who"><h2>${esc(name)}</h2><p>HOLa · ${w.length} semanas registradas</p></div></div><div class="metrics"><div class="metric"><span>Total</span><b>${fmt(total)}</b></div><div class="metric"><span>Media semanal</span><b>${fmt(avg)}</b></div><div class="metric"><span>Media diaria</span><b>${fmt(dayavg)}</b></div><div class="metric"><span>Récord diario</span><b>${fmt(rec)}</b></div><div class="metric"><span>Récord semanal</span><b>${fmt(recw)}</b></div><div class="metric"><span>Días ≥ 7,2M</span><b>${vals.filter(v=>v>=MIN).length}/${vals.length}</b></div></div></section><section class="section"><b>Últimas semanas</b>${w.slice(-8).reverse().map(x=>`<div class="week"><span class="pill ${x.type==='save'?'save':'push'}">${esc(x.type.toUpperCase())}</span><b>${fmt(x.total)}</b><span class="${x.complies?'ok':'bad'}">${x.complies?'Cumple':'No cumple'}</span></div>`).join('')}</section>`}function show(q){const k=key(q),list=players.filter(p=>key(p.name).includes(k)).slice(0,15);suggestions.innerHTML=list.map(p=>{const a=avatar(p);return`<button type="button" data-name="${esc(p.name)}">${a?`<img class="mini" src="${esc(a)}">`:''}<span>${esc(p.name)}</span></button>`}).join('');suggestions.classList.toggle('hidden',!q||!list.length);suggestions.querySelectorAll('button').forEach(b=>b.onclick=()=>{search.value=b.dataset.name;suggestions.classList.add('hidden');render(b.dataset.name)})}search.addEventListener('input',()=>show(search.value));search.addEventListener('focus',()=>{if(search.value)show(search.value)});document.addEventListener('click',e=>{if(!e.target.closest('.search-wrap'))suggestions.classList.add('hidden')});async function load(){view.innerHTML='<div class="empty">Cargando jugadores...</div>';const[a,b]=await Promise.all([sb.from('players').select('name,avatar,uploaded_avatar,hola_avatar,default_avatar').order('name'),sb.from('vs_scores').select('player_name,day,points,week_type,vs_date').gte('day',1).lte('day',6)]);if(a.error){console.error(a.error);view.innerHTML='<div class="empty">Error cargando jugadores.</div>';return}players=a.data||[];scores=b.data||[];view.innerHTML=`<div class="empty">${players.length} jugadores cargados. Escribe un nombre para buscar.</div>`}load();</script></body></html>
