name: Link members page

on:
  push:
    paths:
      - '.github/workflows/link-members.yml'
      - 'members.html'

permissions:
  contents: write

jobs:
  link-members:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link alliance member count to members page
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old = '<div class="overview__stat"><span class="overview__label" data-i18n="members">Members</span><strong class="overview__number" id="membersValue">—</strong></div>'
          new = '<a class="overview__stat" href="members.html" aria-label="Miembros" style="text-decoration:none;color:inherit"><span class="overview__label" data-i18n="members">Members</span><strong class="overview__number" id="membersValue">—</strong></a>'
          if old in text:
              p.write_text(text.replace(old, new, 1), encoding='utf-8')
          elif 'href="members.html"' not in text:
              raise SystemExit('Expected members stat block not found; index left unchanged.')
          PY
      - name: Commit index link
        run: |
          if git diff --quiet -- index.html; then
            echo "No index change needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Link alliance member count to members page"
          git push
