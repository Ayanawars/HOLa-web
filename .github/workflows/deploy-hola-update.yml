name: Deploy HOLa ZIP update

on:
  push:
    paths:
      - 'HOLa-S3-v*-GITHUB-UPDATE.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract latest HOLa update
        shell: bash
        run: |
          set -e
          ZIP="$(find . -maxdepth 1 -type f -name 'HOLa-S3-v*-GITHUB-UPDATE.zip' | sort | tail -n 1)"
          if [ -z "$ZIP" ]; then
            echo "No HOLa update ZIP found."
            exit 0
          fi

          echo "Applying $ZIP"
          rm -rf .hola-update
          mkdir .hola-update
          unzip -o "$ZIP" -d .hola-update
          rsync -a .hola-update/ ./
          rm -rf .hola-update
          rm -f "$ZIP"

      - name: Commit extracted update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Deploy HOLa web update"
          git push
