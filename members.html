<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6efd9">
<title>HOLa · Miembros</title>
  <link rel="preconnect" href="https://ovybstpiomphrouvqxmf.supabase.co" crossorigin>
  <link rel="preconnect" href="https://flagcdn.com" crossorigin>
<style>
:root{
  --cream:#f8f1dc;
  --cream2:#fffdf7;
  --ink:#2f2a20;
  --muted:#6f6656;
  --gold:#c89735;
  --gold2:#f2d995;
  --gold3:#ffebba;
  --sky:#72c8f6;
  --sky2:#dff4ff;
  --sky3:#1d8fcb;
  --green:#0b6b3c;
  --green2:#179456;
  --line:#d9bd74;
  --shadow:0 10px 28px rgba(97,72,21,.12);
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{
  margin:0;
  background:
    radial-gradient(circle at 50% 0%, rgba(191,237,255,.65), transparent 32%),
    radial-gradient(circle at 88% 12%, rgba(255,231,173,.42), transparent 24%),
    linear-gradient(#fbf8ef,#f5ebd2);
  color:var(--ink);
  font-family:Georgia, "Times New Roman", serif;
}
button,input{font:inherit}
.page{
  position:relative;
  width:min(100%,980px);
  margin:auto;
  min-height:100svh;
  padding:0 38px 42px;
  overflow:hidden;
}
.page:before,.page:after{
  content:"";
  position:absolute;
  top:0; bottom:0;
  width:32px;
  z-index:20;
  pointer-events:none;
  background:
    linear-gradient(90deg,#d6b763 0 2px,#fff7df 2px 8px,#d8bc70 8px 10px,#f7edcf 10px 21px,#bd9136 21px 23px,#fff7df 23px 30px,#cda451 30px 32px);
  box-shadow:0 0 14px rgba(119,83,24,.15);
}
.page:before{left:0;}
.page:after{right:0; transform:scaleX(-1)}

.pillar-glyphs{
  position:absolute;
  inset:0 auto 0 0;
  width:32px;
  z-index:21;
  pointer-events:none;
  opacity:.45;
  background:
    radial-gradient(circle at 50% 80px, transparent 0 4px,#ae873c 4.5px 5.5px,transparent 6px),
    linear-gradient(45deg,transparent 47%,#ad883f 48% 52%,transparent 53%) 8px 150px/16px 60px repeat-y;
}
.pillar-glyphs.right{left:auto;right:0;transform:scaleX(-1)}

.hero{
  position:relative;
  height:280px;
  margin:0 -2px 0;
  border-radius:0 0 34px 34px;
  overflow:visible;
  border:1px solid #d6b96f;
  box-shadow:var(--shadow);
  background-image:
    linear-gradient(to bottom,rgba(0,0,0,.03),rgba(0,0,0,.18)),
    url("assets/header-egipto.webp");
  background-size:cover;
  background-position:center 42%;
}
.hero:after{
  content:"";
  position:absolute; inset:auto 0 0;
  height:72px;
  background:linear-gradient(transparent,rgba(248,241,220,.9));
}

.back-button{
  position:absolute;
  z-index:7;
  top:max(10px,env(safe-area-inset-top));
  left:10px;
  width:38px;
  height:38px;
  padding:0;
  border:0;
  border-radius:50%;
  background:transparent;
  cursor:pointer;
  filter:drop-shadow(0 3px 7px rgba(0,0,0,.32));
  -webkit-tap-highlight-color:transparent;
}
.back-button img{
  width:38px;
  height:38px;
  display:block;
  object-fit:contain;
}
.back-button:active{transform:scale(.94)}
.back-button:focus-visible{
  outline:2px solid #fff1a8;
  outline-offset:2px;
}

/* Traductor: copiado del index */
.language{
  position:absolute;
  z-index:8;
  top:max(10px,env(safe-area-inset-top));
  right:10px;
}
.language__toggle{
  width:38px;
  height:38px;
  padding:0;
  display:grid;
  place-items:center;
  border:2px solid rgba(255,228,135,.96);
  border-radius:50%;
  background:rgba(4,70,122,.82);
  box-shadow:0 3px 12px rgba(0,0,0,.32),inset 0 0 0 2px rgba(255,255,255,.13);
  cursor:pointer;
}
.language__current{
  width:25px;
  height:25px;
  border-radius:50%;
  object-fit:cover;
  box-shadow:0 0 0 1px rgba(255,255,255,.85);
}
.language__list{
  position:absolute;
  top:45px;
  right:0;
  width:152px;
  margin:0;
  padding:6px;
  display:grid;
  gap:2px;
  list-style:none;
  border:1px solid rgba(255,212,81,.8);
  border-radius:14px;
  background:rgba(5,59,104,.96);
  box-shadow:0 12px 28px rgba(0,0,0,.35);
  max-height:min(330px,calc(100vw - 62px),calc(100svh - 72px));
  overflow-y:auto;
  overscroll-behavior:contain;
  scrollbar-width:thin;
  -webkit-overflow-scrolling:touch;
}
.language__list[hidden]{display:none}
.language__option{
  width:100%;
  min-height:36px;
  padding:7px 8px;
  display:flex;
  align-items:center;
  gap:9px;
  border:0;
  border-radius:9px;
  background:transparent;
  color:#fff;
  font:600 14px/1 system-ui,sans-serif;
  text-align:left;
  cursor:pointer;
}
.language__option:hover,
.language__option:focus-visible{
  outline:none;
  background:rgba(255,255,255,.14);
}
.language__option img{
  width:24px;
  height:17px;
  border-radius:3px;
  object-fit:cover;
}
.brand{
  position:absolute;
  left:50%;
  top:10px;
  transform:translateX(-50%);
  z-index:5;
  width:min(52%,330px);
  height:122px;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  pointer-events:none;
}
.brand-image img{
  display:block;
  width:100%;
  height:100%;
  object-fit:contain;
  filter:drop-shadow(0 4px 8px rgba(0,0,0,.22));
}

.title-plaque{
  width:min(84%,650px);
  margin:-42px auto 16px;
  position:relative;z-index:5;
  background:linear-gradient(180deg,#fffefb 0%, #f9f0d8 58%, #eef9ff 100%);
  border:2px solid #c59a42;
  outline:1px solid #edd9a0;
  border-radius:22px;
  padding:18px 24px 16px;
  text-align:center;
  box-shadow:0 8px 20px rgba(108,79,22,.14);
}
.title-plaque:before{
  content:"◆";position:absolute;top:-19px;left:50%;transform:translateX(-50%);
  width:34px;height:34px;display:grid;place-items:center;
  background:linear-gradient(180deg,#1ea1dd,#0d6a3c);color:#f8de87;border:2px solid #c89c3b;transform-origin:center;
  clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);
}
.title-plaque h1{margin:0;font-size:clamp(32px,6vw,54px);letter-spacing:2px}
.title-plaque p{margin:2px 0 0;color:#4d4335;font-size:18px;letter-spacing:1px}

.stats{
  display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0 14px;
}
.stat{
  background:linear-gradient(180deg,rgba(255,251,241,.96),rgba(228,246,255,.88));
  border:1px solid #ddc78c;border-radius:16px;
  min-height:88px;display:flex;gap:10px;align-items:center;justify-content:center;
  box-shadow:0 4px 12px rgba(95,70,20,.06), inset 0 0 0 1px rgba(255,255,255,.65);
}
.stat .ico{
  width:42px;height:42px;display:grid;place-items:center;
  font-size:28px;color:var(--sky3);
  border-radius:50%;
  background:linear-gradient(180deg,#fef4c9,#def2ff);
  border:1px solid rgba(200,151,53,.48);
}
.stat .ico img{
  width:34px;height:34px;object-fit:contain;display:block;
}
.stat strong{font-size:28px;line-height:1}
.stat span{display:block;font-size:13px;margin-top:5px;color:#4e463b}

.search-row{display:flex;gap:10px;margin:8px 0 12px}
.search{
  flex:1;display:flex;align-items:center;gap:10px;
  border:1.5px solid #caa257;border-radius:22px;padding:12px 16px;background:linear-gradient(180deg,#fffaf0,#eef9ff);
  box-shadow:inset 0 1px 4px rgba(112,78,18,.05), 0 4px 12px rgba(29,143,203,.06);
}
.search input{border:0;outline:0;background:transparent;width:100%;font-size:18px;color:#40382d}
.search .glass{font-size:24px;color:#188ecb}
.search .ankh{font-size:25px;color:#c28a1a}

.filters{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-bottom:14px}
.filter{
  border:1px solid #dec88e;border-radius:20px;padding:10px 8px;
  background:linear-gradient(180deg,#fffaf0,#eef8ff);color:#3c342a;
  cursor:pointer;transition:.15s;white-space:nowrap;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.55);
}
.filter.active{
  background:linear-gradient(180deg,#36a8df,#0a6fbe);
  color:#fff;border-color:#c59a42;
  box-shadow:0 6px 14px rgba(19,121,181,.25), inset 0 0 0 1px rgba(255,226,151,.42)
}

.roster{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.member{
  background:linear-gradient(180deg,rgba(255,251,241,.96),rgba(236,248,255,.92));
  border:1px solid #d6b76a;border-radius:18px;padding:11px;
  box-shadow:0 5px 14px rgba(97,70,14,.08), inset 0 0 0 1px rgba(255,255,255,.55);
  cursor:pointer;transition:.15s;
}
.member:hover{transform:translateY(-2px);box-shadow:0 9px 18px rgba(97,70,14,.12)}
.member-top{display:grid;grid-template-columns:86px 1fr auto;gap:11px;align-items:start}
.avatar{
  width:86px;height:86px;border-radius:18px;object-fit:cover;
  border:2px solid #d9a93c;
  background:linear-gradient(180deg,#fffdf6,#ebf8ff);
  box-shadow:
    0 6px 16px rgba(29,143,203,.18),
    inset 0 0 0 2px #fff7d7,
    0 0 0 3px rgba(121,201,244,.28);
}
.member h3{font-size:20px;margin:4px 0 8px;line-height:1}
.member .line{font-size:14px;color:#50483d;margin-top:5px}
.dot{width:14px;height:14px;border-radius:50%;background:#2fbe5f;margin-top:3px;border:1px solid rgba(0,0,0,.12)}
.dot.off{background:#aaa}
.member-icons{
  display:flex;flex-wrap:wrap;gap:6px;align-items:center;
  border-top:1px solid #eadfbd;margin-top:9px;padding-top:8px;
  color:#0f6b3d;font-size:19px
}
.member-icons .gold{color:#b8780d}
.member-badge{
  width:36px;height:36px;min-width:36px;padding:0;border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center;gap:0;
  border:2px solid #79c9f4;
  background:radial-gradient(circle at 30% 28%, #ffffff 0%, #eef9ff 48%, #fff2bf 100%);
  box-shadow:
    0 3px 10px rgba(24,142,203,.18),
    inset 0 0 0 1px rgba(255,255,255,.72),
    inset 0 0 0 4px rgba(121,201,244,.16);
  color:#126994;font-size:15px;font-weight:700;
}
.member-badge img{
  width:26px;height:26px;display:block;object-fit:contain;
}
.member-badge.role-badge img{
  width:29px;height:29px;
}
.member-badge.gold-badge{
  border-color:#79c9f4;
  background:radial-gradient(circle at 30% 28%, #fffdf4 0%, #fff0c9 52%, #e6f6ff 100%);
  color:#8b5d00;
}

.profile{
  margin-top:18px;border:2px solid #c89b3d;border-radius:24px;
  background:linear-gradient(180deg,#fffdf7 0%, #f5ead0 70%, #eef9ff 100%);
  box-shadow:0 11px 26px rgba(91,64,12,.16);padding:16px;position:relative;overflow:hidden;
}
.profile:before{
  content:"";
  position:absolute;
  left:24px;
  right:24px;
  top:10px;
  height:1px;
  background:linear-gradient(90deg, transparent 0%, rgba(121,201,244,.38) 18%, rgba(212,164,64,.48) 50%, rgba(121,201,244,.38) 82%, transparent 100%);
}
.profile-grid{display:grid;grid-template-columns:220px 1fr;gap:20px;align-items:start}
.big-portrait{
  width:100%;
  aspect-ratio:1 / 1;
  height:auto;
  object-fit:cover;
  border-radius:22px;
  border:3px solid #d8aa46;
  background:linear-gradient(180deg,#fffdf6,#ebf8ff);
  box-shadow:
    0 10px 24px rgba(29,143,203,.18),
    0 0 0 4px rgba(121,201,244,.30),
    inset 0 0 0 2px rgba(255,247,215,.98);
}
.quote{
  text-align:center;
  font-size:14px;
  line-height:1.4;
  margin:0;
  color:#326b8b;
  font-style:italic;
  font-weight:700;
}
.profile-about-card{
  margin-top:12px;
}
.profile-side-title{
  font-size:14px;
  font-weight:800;
  color:#176f9e;
  margin:0 0 6px;
  letter-spacing:.3px;
}
.profile-about{
  min-height:74px;
  border:1px solid #d9b75f;
  border-left:3px solid #79c9f4;
  background:linear-gradient(180deg,#fffaf0,#eef9ff);
  border-radius:13px;
  padding:10px;
  line-height:1.42;
  font-size:13px;
  color:#4a4033;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.55);
}
.epic-quote-box{
  margin-top:10px;
  padding:10px 9px 9px;
  border-top:1px solid rgba(212,164,64,.42);
  border-bottom:1px solid rgba(121,201,244,.35);
}
.quote-label{
  text-align:center;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:1.5px;
  color:#a66f17;
  font-weight:800;
  margin-bottom:5px;
}
.profile-head{display:flex;justify-content:space-between;gap:12px;align-items:center}
.profile-head h2{margin:0;font-size:28px}
.online{background:#e6f5d8;border-radius:20px;padding:7px 12px;font-size:13px;color:#315f2a}
.meta{margin:7px 0 10px;color:#51473a}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.tile{
  background:linear-gradient(180deg,#fff9e9,#eef8ff);
  border:1px solid #e0c98d;border-radius:14px;padding:10px 5px 8px;text-align:center;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.6);
}
.tile b{display:block;font-size:17px}
.tile small{color:#675e50}
.tile-icon-wrap{
  width:56px;height:56px;border-radius:50%;
  margin:0 auto 6px;
  display:grid;place-items:center;
  background:radial-gradient(circle at 30% 30%, #ffffff 0%, #dff4ff 45%, #ffeeb3 100%);
  border:1px solid rgba(200,151,53,.45);
  box-shadow:0 4px 10px rgba(29,143,203,.08);
}
.tile-icon{width:46px;height:46px;object-fit:contain;display:block}
.tile-icon-wrap.glyph{
  color:#1493cf;font-size:26px;font-weight:700;
}
.section-title{font-size:18px;font-weight:700;margin:11px 0 7px}
.squad{display:grid;grid-template-columns:70px 1fr auto;align-items:center;gap:10px;border-radius:12px;padding:8px 10px;margin:6px 0;background:linear-gradient(90deg,#e7efab,#d6e2b5)}
.squad.air{background:linear-gradient(90deg,#d7eff8,#e4f7ff)}
.squad.missile{background:linear-gradient(90deg,#f7e0a8,#fff0c8)}
.vehicle{font-size:32px;color:#0e7db7}
.power{font-weight:700}
.about{border:1px solid #dec78c;background:#fff9ea;border-radius:12px;padding:12px;line-height:1.45;font-size:14px}
.footer{text-align:center;padding:28px 0 8px;color:#9c6813;text-shadow:0 1px 0 rgba(255,255,255,.5)}
.footer .f-logo{font-size:38px;font-weight:700}
.footer small{letter-spacing:4px;color:#5b5141}

.flag{display:inline-block;width:24px;height:15px;vertical-align:-2px;margin-right:7px;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.1)}
.es{background:linear-gradient(#aa151b 0 25%,#f1bf00 25% 75%,#aa151b 75%)}
.co{background:linear-gradient(#fcd116 0 50%,#003893 50% 75%,#ce1126 75%)}
.mx{background:linear-gradient(90deg,#006847 0 33%,#fff 33% 66%,#ce1126 66%)}
.ar{background:linear-gradient(#74acdf 0 33%,#fff 33% 66%,#74acdf 66%)}

@media(max-width:720px){
  .page{padding:0 28px 30px}
  .page:before,.page:after,.pillar-glyphs{width:24px}
  .hero{height:235px}
  .brand{width:min(54%,300px);height:106px;top:8px}
  .stats{gap:7px}
  .stat{min-height:76px;gap:5px}
  .stat .ico{font-size:23px} .stat strong{font-size:22px} .stat span{font-size:11px}
  .filters{gap:6px} .filter{font-size:13px;padding:9px 4px}
  .member-top{grid-template-columns:74px 1fr auto;gap:8px}
  .avatar{width:74px;height:74px}
  .member h3{font-size:16px}
  .member .line{font-size:12px}
  .member-icons{font-size:16px}
  .profile-grid{grid-template-columns:180px 1fr;gap:14px}
  .big-portrait{aspect-ratio:1 / 1;height:auto}
  .tiles{grid-template-columns:repeat(5,1fr)}
  .tile{padding:7px 2px} .tile b{font-size:14px} .tile small{font-size:10px}
}
@media(max-width:520px){
  .page{padding:0 22px 24px}
  .page:before,.page:after,.pillar-glyphs{width:20px}
  .hero{height:205px}
  
  .brand{width:min(58%,235px);height:88px;top:5px}
  .title-plaque{width:92%;margin-top:-34px;padding:13px 12px 12px}
  .title-plaque h1{font-size:30px}
  .title-plaque p{font-size:14px}
  .stats{grid-template-columns:repeat(4,1fr);gap:5px}
  .stat{min-height:66px;flex-direction:column;gap:2px}
  .stat .ico{font-size:18px} .stat strong{font-size:18px} .stat span{font-size:9px;margin-top:1px}
  .search{padding:10px 12px} .search input{font-size:15px}
  .filters{overflow-x:auto;grid-template-columns:repeat(5,minmax(82px,1fr));padding-bottom:2px}
  .roster{grid-template-columns:repeat(2, minmax(0,1fr));gap:8px}
  .member{padding:8px}
  .member-top{grid-template-columns:58px 1fr auto;gap:7px}
  .avatar{width:58px;height:58px;border-radius:12px}
  .member h3{font-size:14px;margin-bottom:5px}
  .member .line{font-size:10px;margin-top:3px}
  .dot{width:10px;height:10px}
  .member-icons{font-size:13px;gap:4px}
  .profile{padding:11px}
  .profile-grid{grid-template-columns:1fr}
  .profile-left{display:block}
  .big-portrait{aspect-ratio:1 / 1;height:auto;max-width:280px;margin:0 auto}
  .profile-about-card{margin-top:10px}
  .profile-about{min-height:66px;font-size:12px}
  .epic-quote-box{margin-top:8px;padding:9px 8px}
  .quote{font-size:12px}
  .profile-head h2{font-size:23px}
  .tiles{grid-template-columns:repeat(5,1fr);gap:4px}
  .tile b{font-size:12px} .tile small{font-size:8px}
  .squad{grid-template-columns:44px 1fr auto;font-size:12px;padding:6px}
  .vehicle{font-size:22px}
  .about{font-size:12px}
}

.members-message{grid-column:1/-1;padding:28px 16px;text-align:center;color:#6f6656;border:1px dashed #d6b76a;border-radius:16px;background:rgba(255,251,241,.72)}
.members-error{color:#8b2f27;border-color:#c98b78;background:#fff4ef}
.member-copy{min-width:0}.member h3{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flag-img{width:24px;height:16px;object-fit:cover;border-radius:2px;vertical-align:-3px;margin-right:7px;box-shadow:0 0 0 1px rgba(0,0,0,.10)}
.flag-placeholder{display:inline-grid;place-items:center;width:24px;height:16px;margin-right:7px;color:#b17917;vertical-align:-1px}
.country-line{display:flex;align-items:center;min-width:0}.country-line span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.location-line{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.avatar-fallback{object-fit:contain;padding:8px;background:linear-gradient(#fffaf0,#f3e5bd)}
.muted-icon{color:#b8a47a}.profile[hidden]{display:none!important}.online.pending{background:#eee8d8;color:#75694d}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.meta-sep{opacity:.45}
.squad-empty{border:1px dashed #dec78c;background:#fff9ea;border-radius:10px;padding:10px;text-align:center;color:#776c5c}
.about{white-space:pre-line}
@media(max-width:480px){.tiles{grid-template-columns:repeat(2,1fr)}.tiles .tile:last-child{grid-column:span 2}.profile-head{align-items:flex-start}.online{white-space:nowrap;font-size:11px;padding:6px 8px}}


/* TrebEdit / Android WebView safe mode */
.member{transition:none}
.member:hover{transform:none}
.members-more{
  grid-column:1/-1;
  width:100%;
  min-height:48px;
  border:1px solid #c8a451;
  border-radius:16px;
  background:#fff9e9;
  color:#6a4d16;
  font-weight:700;
  cursor:pointer;
}
.members-more:active{background:#f5e8bd}


@media(max-width:520px){
  .member-badge{width:30px;height:30px;min-width:30px;padding:0;font-size:13px}
  .member-badge img{width:21px;height:21px}
  .member-badge.role-badge img{width:24px;height:24px}
  .filter-icon-img{width:22px;height:22px}
  .vehicle-img{width:30px;height:30px}
  .tile-icon-wrap{width:44px;height:44px}
  .tile-icon{width:37px;height:37px}
}


.filter{

.avatar-shell{

    0 7px 18px rgba(29,143,203,.18),
    0 0 0 1px rgba(217,169,60,.46);
}
.avatar-shell:before{
  content:"";
  position:absolute;
  inset:3px;
  border-radius:17px;
  border:1px solid rgba(255,248,220,.92);
  box-shadow:
    inset 0 0 0 1px rgba(121,201,244,.30),
    inset 0 0 0 3px rgba(217,169,60,.14);
  pointer-events:none;
}
.avatar-shell:after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:20px;
  pointer-events:none;
  background:
    linear-gradient(#e1b247,#e1b247) 7px 7px/14px 2px no-repeat,
    linear-gradient(#e1b247,#e1b247) 7px 7px/2px 14px no-repeat,
    linear-gradient(#79c9f4,#79c9f4) calc(100% - 21px) 7px/14px 2px no-repeat,
    linear-gradient(#79c9f4,#79c9f4) calc(100% - 9px) 7px/2px 14px no-repeat,
    linear-gradient(#79c9f4,#79c9f4) 7px calc(100% - 9px)/14px 2px no-repeat,
    linear-gradient(#79c9f4,#79c9f4) 7px calc(100% - 21px)/2px 14px no-repeat,
    linear-gradient(#e1b247,#e1b247) calc(100% - 21px) calc(100% - 9px)/14px 2px no-repeat,
    linear-gradient(#e1b247,#e1b247) calc(100% - 9px) calc(100% - 21px)/2px 14px no-repeat;
  opacity:.95;
}
.avatar-shell .avatar{
  width:100%;
  height:100%;
}

.portrait-shell{
  position:relative;
  border-radius:28px;
  padding:8px;
  background:
    linear-gradient(180deg,#f2c961 0%, #b8ecff 18%, #71caf5 38%, #bfefff 56%, #f2ce70 78%, #fff4cf 100%);
  box-shadow:
    0 12px 28px rgba(29,143,203,.18),
    0 0 0 1px rgba(217,169,60,.44);
}
.portrait-shell:before{
  content:"";
  position:absolute;
  inset:4px;
  border-radius:22px;
  border:1px solid rgba(255,248,220,.92);
  box-shadow:
    inset 0 0 0 1px rgba(121,201,244,.32),
    inset 0 0 0 4px rgba(217,169,60,.12);
  pointer-events:none;
}
.portrait-shell:after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:28px;
  pointer-events:none;
  background:
    linear-gradient(#e1b247,#e1b247) 10px 10px/24px 3px no-repeat,
    linear-gradient(#e1b247,#e1b247) 10px 10px/3px 24px no-repeat,
    linear-gradient(#79c9f4,#79c9f4) calc(100% - 34px) 10px/24px 3px no-repeat,
    linear-gradient(#79c9f4,#79c9f4) calc(100% - 13px) 10px/3px 24px no-repeat,
    linear-gradient(#79c9f4,#79c9f4) 10px calc(100% - 13px)/24px 3px no-repeat,
    linear-gradient(#79c9f4,#79c9f4) 10px calc(100% - 34px)/3px 24px no-repeat,
    linear-gradient(#e1b247,#e1b247) calc(100% - 34px) calc(100% - 13px)/24px 3px no-repeat,
    linear-gradient(#e1b247,#e1b247) calc(100% - 13px) calc(100% - 34px)/3px 24px no-repeat;
  opacity:.96;
}
.portrait-shell .big-portrait{
  display:block;
}

.profile-left:before{
  content:"";
  position:absolute;
  inset:-10px -8px -8px -8px;
  border-radius:30px;
  border:1px solid rgba(121,201,244,.44);
  pointer-events:none;
  background:
    linear-gradient(rgba(121,201,244,.32),rgba(121,201,244,.32)) 0 18px/100% 1px no-repeat,
    linear-gradient(rgba(225,178,71,.28),rgba(225,178,71,.28)) 18px 0/calc(100% - 36px) 1px no-repeat;
  box-shadow: inset 0 0 0 1px rgba(225,178,71,.12);
}

@media(max-width:520px){

      linear-gradient(#e1b247,#e1b247) calc(100% - 10px) calc(100% - 24px)/2px 16px no-repeat;
  }
}
