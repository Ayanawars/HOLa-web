    .hero__scarab:before,.hero__scarab:after{content:"";position:absolute;top:-5px;width:22px;height:11px;border:2px solid #c88a19;border-top:0}

    .back{position:absolute;z-index:8;top:max(12px,env(safe-area-inset-top));left:11px;width:48px;height:44px;border:0;background:transparent;color:#063f73;text-decoration:none;display:grid;place-items:center;filter:drop-shadow(0 2px 2px rgba(255,255,255,.75))}

    main{position:relative;z-index:5;margin-top:-17px;padding:0 11px 42px}
    .panel{border:1px solid rgba(229,178,61,.68);border-radius:24px 24px 18px 18px;background:linear-gradient(145deg,rgba(255,255,255,.98),rgba(255,249,236,.97));box-shadow:var(--shadow);overflow:hidden}
    .panel__top{padding:15px 13px 12px;background:linear-gradient(90deg,rgba(8,127,197,.09),rgba(239,137,189,.06),rgba(255,214,93,.13));border-bottom:1px solid rgba(8,127,197,.13)}
    .panel__row{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}.panel__title{margin:0;color:#0a477a;font:900 17px/1 "Cinzel",serif;text-transform:uppercase}.panel__count{color:#9b681c;font-size:12px;font-weight:900;white-space:nowrap}
    .panel__hint{margin:5px 0 0;color:#58738a;font-size:11px;line-height:1.3}
    .search{position:relative;margin-top:11px}.search input{width:100%;height:42px;padding:0 42px 0 14px;border:1px solid rgba(13,126,193,.32);border-radius:14px;background:#fff;color:#143b5e;outline:none;box-shadow:inset 0 1px 3px rgba(16,69,101,.05)}.search input:focus{border-color:#14a9ce;box-shadow:0 0 0 3px rgba(20,169,206,.12)}.search svg{position:absolute;right:13px;top:50%;width:20px;height:20px;transform:translateY(-50%);stroke:#1687bc;fill:none;stroke-width:2}
    .filters{display:flex;gap:6px;margin-top:9px;overflow-x:auto;padding-bottom:1px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.filter{flex:0 0 auto;height:29px;padding:0 11px;border:1px solid rgba(8,127,197,.2);border-radius:999px;background:#fff;color:#315b7d;font-size:10px;font-weight:850;cursor:pointer}.filter[aria-pressed="true"]{border-color:#0e91c8;background:linear-gradient(180deg,#22b8d8,#087fc5);color:white;box-shadow:0 3px 8px rgba(8,127,197,.2)}

    .member__complete{position:absolute;z-index:2;right:7px;bottom:7px;height:19px;padding:0 6px;display:flex;align-items:center;border-radius:8px;background:rgba(3,91,137,.88);color:#fff;font-size:9px;font-weight:900;box-shadow:0 2px 5px rgba(0,0,0,.22)}

    .badges{display:flex;flex-wrap:wrap;gap:4px}.badge{min-height:19px;padding:2px 6px;display:inline-flex;align-items:center;gap:4px;border:1px solid rgba(15,115,170,.18);border-radius:7px;background:#eef9fc;color:#0b527d;font-size:8px;font-weight:900;line-height:1}.badge--gold{background:#fff5cf;border-color:#e6b643;color:#80510b}.badge--pink{background:#fff0f7;border-color:#ef9cc6;color:#a83b76}.badge--over{background:#eef1ff;border-color:#8ea3dd;color:#344d91}

    .state{grid-column:1/-1;padding:28px 14px;text-align:center;color:#627b8f}.state strong{display:block;color:#164b74;margin-bottom:5px}.retry{margin-top:10px;padding:8px 13px;border:1px solid #1189bd;border-radius:10px;background:#fff;color:#0b5d8a;font-weight:800;cursor:pointer}
    .skeleton{height:196px;border-radius:16px;background:linear-gradient(90deg,#edf2ef 25%,#fff 42%,#edf2ef 60%);background-size:260% 100%;animation:shine 1.25s linear infinite}@keyframes shine{to{background-position:-260% 0}}

    dialog{width:min(520px,100%);max-width:520px;max-height:92dvh;margin:auto auto 0;padding:0;border:0;border-radius:24px 24px 0 0;background:#fffaf0;color:var(--ink);box-shadow:0 -12px 40px rgba(0,27,52,.28)}dialog::backdrop{background:rgba(2,28,49,.58);backdrop-filter:blur(2px)}
    .detail{max-height:92dvh;overflow:auto;padding-bottom:max(22px,env(safe-area-inset-bottom))}.detail__hero{position:relative;height:208px;overflow:hidden;background:linear-gradient(155deg,#63c9eb,#effcff 48%,#e7bd6a)}.detail__hero:after{content:"";position:absolute;inset:auto 0 0;height:45%;background:linear-gradient(transparent,rgba(2,48,83,.44))}.detail__avatar{width:100%;height:100%;display:block;object-fit:cover}.detail__fallback{height:100%;display:grid;place-items:center;color:#fff;font:900 72px/1 "Cinzel",serif;text-shadow:0 3px 4px #083a68}.detail__close{position:absolute;z-index:5;top:11px;right:11px;width:38px;height:38px;border:2px solid rgba(255,221,111,.95);border-radius:50%;background:rgba(5,67,112,.86);color:#fff;font-size:23px;line-height:1;cursor:pointer}.detail__namebox{position:absolute;z-index:3;left:15px;right:58px;bottom:13px;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.55)}.detail__name{margin:0;font:900 24px/1 "Cinzel",serif}.detail__loc{margin:5px 0 0;font-size:11px;font-weight:700}.detail__body{padding:13px}.detail__badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.detail__badges .badge{min-height:25px;padding:4px 8px;font-size:10px}
    .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}.metric{padding:9px 5px;border:1px solid rgba(20,136,186,.18);border-radius:12px;background:#f7fcfd;text-align:center}.metric small{display:block;color:#668096;font-size:8px;font-weight:900;text-transform:uppercase}.metric strong{display:block;margin-top:3px;color:#0a4777;font-size:14px}
    .section{margin-top:11px;padding:11px;border:1px solid rgba(222,170,51,.43);border-radius:14px;background:rgba(255,255,255,.67)}.section__title{margin:0 0 8px;color:#8b5b12;font:900 12px/1 "Cinzel",serif;text-transform:uppercase}.squad{display:grid;grid-template-columns:27px 1fr auto;gap:7px;align-items:center;padding:8px 0}.squad+.squad{border-top:1px solid rgba(10,104,156,.11)}.squad__icon{width:27px;height:27px;display:grid;place-items:center;border-radius:9px;background:#e9f7fb;color:#0b78aa}.squad__icon svg{width:18px;height:18px;fill:currentColor}.squad__type{font-size:11px;font-weight:900;color:#164f76}.squad__label{display:block;color:#7a8994;font-size:8px;font-weight:800;text-transform:uppercase}.squad__power{color:#0d466f;font-size:12px;font-weight:900}.about{margin:0;color:#405f75;font-size:12px;line-height:1.55;white-space:pre-wrap}.empty{color:#8a989f;font-style:italic}

    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}.skeleton{animation:none}}
  </style>
</head>

    ro:{members:'MEMBRI',directory:'Director HOLa',hint:'Atinge o fișă pentru profilul complet.',search:'Caută jucător…',all:'Toți',completed:'Sondaj ✓',about:'Despre mine',squads:'Echipe',rank:'Rang',back:'Înapoi',players:'jucători',noLocation:'Locație neînregistrată',noAbout:'Acest membru nu și-a scris încă povestea.',noSquads:'Nicio echipă înregistrată',error:'Membrii nu au putut fi încărcați.',retry:'Reîncearcă',empty:'Niciun membru nu corespunde.',engineer:'Inginer',warlord:'Warlord'},
    pt:{members:'MEMBROS',directory:'Diretório HOLa',hint:'Toque numa ficha para ver o perfil completo.',search:'Buscar jogador…',all:'Todos',completed:'Pesquisa ✓',about:'Sobre mim',squads:'Esquadrões',rank:'Patente',back:'Voltar',players:'jogadores',noLocation:'Localização não registrada',noAbout:'Este membro ainda não escreveu sua história.',noSquads:'Sem esquadrões registrados',error:'Não foi possível carregar os membros.',retry:'Tentar novamente',empty:'Nenhum membro corresponde.',engineer:'Engenheiro',warlord:'Warlord'},
    uk:{members:'УЧАСНИКИ',directory:'Каталог HOLa',hint:'Торкніться картки, щоб відкрити повний профіль.',search:'Пошук гравця…',all:'Усі',completed:'Опитування ✓',about:'Про мене',squads:'Загони',rank:'Ранг',back:'Назад',players:'гравців',noLocation:'Місце не вказано',noAbout:'Цей учасник ще не написав свою історію.',noSquads:'Загони не вказані',error:'Не вдалося завантажити учасників.',retry:'Повторити',empty:'Немає відповідних учасників.',engineer:'Інженер',warlord:'Warlord'},
    it:{members:'MEMBRI',directory:'Elenco HOLa',hint:'Tocca una scheda per vedere il profilo completo.',search:'Cerca giocatore…',all:'Tutti',completed:'Sondaggio ✓',about:'Su di me',squads:'Squadre',rank:'Rango',back:'Indietro',players:'giocatori',noLocation:'Posizione non registrata',noAbout:'Questo membro non ha ancora scritto la sua storia.',noSquads:'Nessuna squadra registrata',error:'Impossibile caricare i membri.',retry:'Riprova',empty:'Nessun membro corrisponde.',engineer:'Ingegnere',warlord:'Warlord'},
    pl:{members:'CZŁONKOWIE',directory:'Katalog HOLa',hint:'Dotknij karty, aby zobaczyć pełny profil.',search:'Szukaj gracza…',all:'Wszyscy',completed:'Ankieta ✓',about:'O mnie',squads:'Oddziały',rank:'Ranga',back:'Wstecz',players:'graczy',noLocation:'Lokalizacja niepodana',noAbout:'Ten członek nie napisał jeszcze swojej historii.',noSquads:'Brak zapisanych oddziałów',error:'Nie udało się załadować członków.',retry:'Spróbuj ponownie',empty:'Brak pasujących członków.',engineer:'Inżynier',warlord:'Warlord'}
  };

  let players=[];let activeFilter='all';let language=localStorage.getItem('hola-language')||'es';let openedPlayer=null;
  const grid=document.getElementById('membersGrid'),countEl=document.getElementById('memberCount'),searchInput=document.getElementById('searchInput'),dialog=document.getElementById('memberDialog');
  const t=key=>(I18N[language]||I18N.es)[key]||I18N.es[key]||key;

  function safeAvatar(value){const v=String(value||'').trim();return /^data:image\/(jpeg|jpg|png|webp);base64,/i.test(v)||/^https:\/\//i.test(v)?v:''}
  function initials(name){return String(name||'?').trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase().slice(0,2)||'?'}
  function emojiFlagCode(value){const chars=[...String(value||'').trim()];if(chars.length!==2)return'';const cps=chars.map(c=>c.codePointAt(0));if(cps.every(n=>n>=0x1F1E6&&n<=0x1F1FF))return cps.map(n=>String.fromCharCode(97+n-0x1F1E6)).join('');return''}
  function countryCode(player){const emoji=emojiFlagCode(player.flag);if(emoji)return emoji;const raw=String(player.country||player.flag||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();const map={spain:'es',espana:'es',romania:'ro',rumania:'ro',france:'fr',francia:'fr',germany:'de',alemania:'de','united kingdom':'gb','reino unido':'gb',uk:'gb',portugal:'pt',italy:'it',italia:'it',poland:'pl',polonia:'pl',ukraine:'ua',ucrania:'ua',australia:'au',bulgaria:'bg',philippines:'ph',filipinas:'ph',colombia:'co',argentina:'ar',chile:'cl',mexico:'mx','united states':'us',usa:'us',canada:'ca',belgium:'be',belgica:'be',netherlands:'nl',holanda:'nl',switzerland:'ch',suiza:'ch',austria:'at',greece:'gr',grecia:'gr',turkey:'tr',turquia:'tr',brazil:'br',brasil:'br'};return map[raw]||''}
  function locationText(p){const parts=[p.city,p.community,p.country].map(v=>String(v||'').trim()).filter(Boolean);return [...new Set(parts.map(v=>v.toLowerCase()))].map(k=>parts.find(v=>v.toLowerCase()===k)).join(' · ')||t('noLocation')}
  function professionText(v){const x=String(v||'').toLowerCase();if(x.includes('engine'))return t('engineer');if(x.includes('warlord'))return t('warlord');return v||''}
  function squadSvg(type){const x=String(type||'').toLowerCase();if(x.includes('air'))return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.8 10.9 14.7 8l-.8-5.1-1.9-1-1.2 5.2-5.7-2.3-1.5.8 4.8 4.1-3.8 2.2-2.8-.9-1.3.8 3.3 3.2 1 4.5 1.4-.4.8-3.1 4.2-1.6 1.1 7 1.9-.9.6-7.9 6.8-3.2z"/></svg>';if(x.includes('miss'))return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.8 2.2c2.6-.7 4.9-.3 6 .1.4 1.1.8 3.4.1 6l-7.6 7.6-4.8-4.8 6.3-8.9zM8.6 12l3.4 3.4-2 2-1.4-.7-2.5 2.5-1.3-1.3 2.5-2.5-.7-1.4 2-2zm-3.2.8-3.8.9 4.7-4.8 1.7.6-2.6 3.3zm5.8 5.8 3.3-2.6.6 1.7-4.8 4.7.9-3.8z"/></svg>';return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h11.5l3 3H22v6h-2.1a3 3 0 0 1-5.8 0H9.9a3 3 0 0 1-5.8 0H2v-5h2V8zm4-4h7v3H8V4zm-1 11.2A1.8 1.8 0 1 0 7 18.8a1.8 1.8 0 0 0 0-3.6zm10 0a1.8 1.8 0 1 0 0 3.6 1.8 1.8 0 0 0 0-3.6z"/></svg>'}
  function addFlag(container,p,cls='member__flag'){const code=countryCode(p);if(code){const img=document.createElement('img');img.className=cls;img.src=`https://flagcdn.com/w80/${code}.png`;img.alt=String(p.country||'');img.loading='lazy';container.appendChild(img)}else{const ph=document.createElement('span');ph.className='member__flag-placeholder';ph.setAttribute('aria-hidden','true');container.appendChild(ph)}}
  function badge(text,kind='',icon=''){const el=document.createElement('span');el.className=`badge ${kind}`.trim();if(icon){const i=document.createElement('span');i.className='squad-mini';i.innerHTML=icon;el.appendChild(i)}el.append(document.createTextNode(text));return el}

  function renderCard(p){const b=document.createElement('button');b.type='button';b.className='member';b.setAttribute('aria-label',p.name);const portrait=document.createElement('div');portrait.className='member__portrait';const src=safeAvatar(p.avatar);if(src){const img=document.createElement('img');img.className='member__avatar';img.src=src;img.alt='';img.loading='lazy';img.decoding='async';portrait.appendChild(img)}else{const f=document.createElement('div');f.className='member__fallback';f.textContent=initials(p.name);portrait.appendChild(f)}addFlag(portrait,p);if(p.survey_completed){const ok=document.createElement('span');ok.className='member__complete';ok.textContent='✓';ok.title=t('completed');portrait.appendChild(ok)}b.appendChild(portrait);
    const body=document.createElement('div');body.className='member__body';const name=document.createElement('h3');name.className='member__name';name.textContent=p.name;body.appendChild(name);const loc=document.createElement('p');loc.className='member__location';loc.textContent=locationText(p);body.appendChild(loc);const badges=document.createElement('div');badges.className='badges';if(p.hq_level)badges.appendChild(badge(`HQ ${p.hq_level}`,'badge--gold'));if(p.t10)badges.appendChild(badge('T10','badge--pink'));if(p.squad1_type)badges.appendChild(badge(p.squad1_type,'',squadSvg(p.squad1_type)));if(p.supreme_lord_unlocked)badges.appendChild(badge('OVER','badge--over'));body.appendChild(badges);b.appendChild(body);b.addEventListener('click',()=>openDetail(p));return b}

  function filteredPlayers(){const q=searchInput.value.trim().toLowerCase();return players.filter(p=>{if(activeFilter==='completed'&&!p.survey_completed)return false;if(activeFilter==='t10'&&!p.t10)return false;if(activeFilter==='overlord'&&!p.supreme_lord_unlocked)return false;if(!q)return true;return [p.name,p.city,p.community,p.country,p.profession,p.squad1_type].some(v=>String(v||'').toLowerCase().includes(q))})}
  function render(){const list=filteredPlayers();grid.replaceChildren();countEl.textContent=`${list.length} ${t('players')}`;if(!list.length){const s=document.createElement('div');s.className='state';s.textContent=t('empty');grid.appendChild(s);return}const frag=document.createDocumentFragment();list.forEach(p=>frag.appendChild(renderCard(p)));grid.appendChild(frag)}

  async function loadPlayers(){grid.innerHTML='<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';try{const url=`${SUPABASE_URL}/rest/v1/players?select=${PLAYER_FIELDS.join(',')}&order=survey_completed.desc,name.asc`;const response=await fetch(url,{headers:{apikey:SUPABASE_PUBLISHABLE_KEY,Accept:'application/json'},cache:'no-store'});if(!response.ok)throw new Error(`Supabase ${response.status}`);players=await response.json();render()}catch(error){console.error(error);grid.replaceChildren();const state=document.createElement('div');state.className='state';const strong=document.createElement('strong');strong.textContent=t('error');state.appendChild(strong);const retry=document.createElement('button');retry.className='retry';retry.type='button';retry.textContent=t('retry');retry.addEventListener('click',loadPlayers);state.appendChild(retry);grid.appendChild(state);countEl.textContent='—'}}

  function openDetail(p){openedPlayer=p;const hero=document.getElementById('detailHero');hero.querySelectorAll('.detail__avatar,.detail__fallback').forEach(n=>n.remove());const src=safeAvatar(p.avatar);const close=document.getElementById('detailClose');if(src){const img=document.createElement('img');img.className='detail__avatar';img.src=src;img.alt='';hero.insertBefore(img,close)}else{const f=document.createElement('div');f.className='detail__fallback';f.textContent=initials(p.name);hero.insertBefore(f,close)}document.getElementById('detailName').textContent=p.name;document.getElementById('detailLocation').textContent=locationText(p);document.getElementById('detailThp').textContent=p.thp||'—';document.getElementById('detailHq').textContent=p.hq_level?String(p.hq_level):'—';document.getElementById('detailRank').textContent=p.rank||'—';const badges=document.getElementById('detailBadges');badges.replaceChildren();if(p.t10)badges.appendChild(badge('T10','badge--pink'));if(p.profession)badges.appendChild(badge(professionText(p.profession)));if(p.supreme_lord_unlocked)badges.appendChild(badge('OVERLORD','badge--over'));if(p.survey_completed)badges.appendChild(badge('✓ '+t('completed'),'badge--gold'));
    const squads=document.getElementById('detailSquads');squads.replaceChildren();let has=false;[1,2,3].forEach(n=>{const type=p[`squad${n}_type`],power=p[`squad${n}_power`];if(!type&&!power)return;has=true;const row=document.createElement('div');row.className='squad';const icon=document.createElement('span');icon.className='squad__icon';icon.innerHTML=squadSvg(type);const mid=document.createElement('div');const label=document.createElement('span');label.className='squad__label';label.textContent=`Squad ${n}`;const ty=document.createElement('span');ty.className='squad__type';ty.textContent=type||'—';mid.append(label,ty);const pw=document.createElement('strong');pw.className='squad__power';pw.textContent=power||'—';row.append(icon,mid,pw);squads.appendChild(row)});if(!has){const e=document.createElement('p');e.className='about empty';e.textContent=t('noSquads');squads.appendChild(e)}const about=document.getElementById('detailAbout');about.textContent=String(p.about_me||'').trim()||t('noAbout');about.classList.toggle('empty',!String(p.about_me||'').trim());if(!dialog.open)dialog.showModal()}

  function applyLanguage(lang){language=I18N[lang]?lang:'es';localStorage.setItem('hola-language',language);document.documentElement.lang=language;document.title=`HOLa — ${t('members')}`;document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=t(el.dataset.i18n)});document.querySelectorAll('[data-i18n-aria]').forEach(el=>el.setAttribute('aria-label',t(el.dataset.i18nAria)));document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>el.setAttribute('placeholder',t(el.dataset.i18nPlaceholder)));if(players.length)render();if(openedPlayer&&dialog.open)openDetail(openedPlayer)}

  searchInput.addEventListener('input',render);document.getElementById('filters').addEventListener('click',e=>{const b=e.target.closest('.filter');if(!b)return;activeFilter=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render()});document.getElementById('detailClose').addEventListener('click',()=>dialog.close());dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()});dialog.addEventListener('close',()=>{openedPlayer=null});
  const languageToggle=document.getElementById('languageToggle'),languageList=document.getElementById('languageList'),currentFlag=document.getElementById('currentFlag');languageToggle.addEventListener('click',()=>{const open=languageList.hidden;languageList.hidden=!open;languageToggle.setAttribute('aria-expanded',String(open))});languageList.addEventListener('click',e=>{const b=e.target.closest('.language__option');if(!b)return;currentFlag.src=`https://flagcdn.com/w80/${b.dataset.code}.png`;currentFlag.alt=b.dataset.name;applyLanguage(b.dataset.lang);languageList.hidden=true;languageToggle.setAttribute('aria-expanded','false')});document.addEventListener('click',e=>{if(!e.target.closest('.language')){languageList.hidden=true;languageToggle.setAttribute('aria-expanded','false')}});
  const langButton=[...document.querySelectorAll('.language__option')].find(b=>b.dataset.lang===language)||document.querySelector('.language__option[data-lang="es"]');if(langButton){currentFlag.src=`https://flagcdn.com/w80/${langButton.dataset.code}.png`;currentFlag.alt=langButton.dataset.name}applyLanguage(language);loadPlayers();
</script>
