<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#12394a"><title>Colmena · HOLa</title><link rel="stylesheet" href="map.css?v=20261015-hive-1"></head>
<body class="public hive-public">
<main>
 <header class="hive-header"><a class="hive-back" href="index.html" aria-label="Volver a HOLa">‹ <span>HOLa</span></a><div><p class="hive-eyebrow">HEROES OF LAST AREA</p><h1 id="title">Colmena</h1></div><button id="language" class="hive-language" type="button">English</button><p id="intro" class="sr-only">Encuentra tu posición en el mapa de la alianza.</p></header>
 <div id="content">
  <section class="hive-map-card" aria-label="Mapa de la colmena">
   <div class="hive-map-bar"><div class="hive-legend" aria-label="Leyenda"><span class="legend-correct" id="legend-correct">Bien colocado</span><span class="legend-wrong" id="legend-wrong">Revisar posición</span><span class="legend-unknown" id="legend-unknown">Sin confirmar</span></div><button id="download" class="hive-download" type="button">Descargar mapa</button></div>
   <div class="hive-map-stage"><div id="viewport"><canvas id="map" aria-label="Mapa de posiciones de HOLa"></canvas></div><div class="hive-map-tools"><button id="zoom-in" type="button" aria-label="Acercar">+</button><button id="zoom-out" type="button" aria-label="Alejar">−</button><button id="fit" type="button" aria-label="Ver todo el mapa">⌖</button></div></div>
   <div class="hive-search-dock">
    <div class="hive-selection"><p id="selected" aria-live="polite">—</p><button id="copy" type="button" disabled>Copiar coordenadas</button></div>
    <div class="hive-search-wrap"><label id="search-label" for="search">Encuentra tu puesto</label><div class="hive-search-field"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Busca tu nombre…" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="matches"><span class="hive-search-chevron" aria-hidden="true">⌃</span></div><div id="matches" role="listbox" aria-label="Jugadores de la colmena" hidden></div></div>
    <button id="find" type="button" hidden>Buscar</button><p id="map-hint">Elige tu nombre para ir directamente a tu posición.</p>
   </div>
  </section>
  <p id="public-scan-date" class="hive-scan-date" role="status">Cargando estado de las posiciones…</p>
 </div>
 <p id="terrain-note" class="sr-only">Contorno aproximado: comprueba la colocación en el juego.</p><p id="status" role="status" aria-live="polite"></p>
</main><script type="module" src="js/alliance-map.js?v=20261015-hive-1"></script>
